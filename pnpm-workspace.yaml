packages:
  - packages/*

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@sentry/cli'
  - cpu-features
  - esbuild
  - protobufjs
  - sharp
  - ssh2

# @react-pdf/textkit 6.2.0 NFD-decomposed Latin text for embedded fonts, and the
# renderer misplaces the resulting combining marks — every French diacritic was
# drawn next to its letter instead of over it (#4017). Fixed upstream in 6.3.0
# (diegomura/react-pdf#3384), which the transitive '^6.2.0' range already allows.
# Pinned here so a re-resolution cannot fall back to 6.2.0.
#
# next-auth declares nodemailer as an optional peer for its Email provider,
# which egapro does not use (ProConnect only). pnpm still installed the 7.x line,
# flagged by several advisories; the peer is dropped instead of being resolved.
overrides:
  '@react-pdf/textkit': '^6.3.0'
  'next-auth>nodemailer': '-'


# Recharts spreads `width`/`height` as HTML attributes on its `.recharts-wrapper`
# <div>, which RGAA 10.1 forbids (presentation attributes are only allowed on
# img, object, embed, canvas and svg); the size is already set in `style` (#5015).
# Guarded by src/modules/admin/stats/__tests__/chartsPresentationAttributes.test.tsx.
patchedDependencies:
  recharts@3.10.1: patches/recharts@3.10.1.patch
