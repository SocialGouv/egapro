[metadata]
name = egapro
version = 2022.07.28

[options]
packages = find:
include_package_data = True
python_requires = >=3.12
install_requires =
    arrow==1.4.0
    asyncpg==0.31.0
    asyncstdlib==3.14.0
    # Kept on 2.15: newer versions change the validation messages sent to users.
    fastjsonschema==2.15.3
    fpdf2==2.3.5
    france-naf==20210302
    httpx==0.28.1
    Jinja2==3.1.6
    # Needed to optimize XLSX writting by openpyxl.
    lxml==6.1.3
    minicli==0.5.0
    openpyxl==3.1.5
    progressist==0.1.0
    pyjwt==2.15.1
    python-stdnum==1.17
    PyYAML==6.0.3
    roll==0.13.3
    sentry-sdk==1.45.1
    ujson==5.13.0

[options.extras_require]
dev =
    black==24.10.0
    hupper==1.12.1
    mkdocs==1.6.1
test =
    coverage==7.6.1
    pytest==7.4.4
    pytest-asyncio==0.21.2
    pytest-cov==5.0.0
prod =
    gunicorn==23.0.0
    uvloop==0.22.1


[options.entry_points]
console_scripts =
    egapro = egapro.bin:main


[coverage:run]
source = egapro
omit =
    egapro/bin.py

[coverage:report]
# Regexes for lines to exclude from consideration
exclude_lines =
    pragma: no cover
    def __repr__

[tool:pytest]
testpaths =
    test
asyncio_mode = auto
markers =
    unowned: do not grant the default test user ownership of the test sirens
