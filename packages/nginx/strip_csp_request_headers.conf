# Next.js derives the script nonce from the Content-Security-Policy *request* header, falling back to
# Content-Security-Policy-Report-Only: only the middleware may set them (GHSA-ffhc-5mcf-pf4q, nonce
# reflection, fixed in Next 15.5 only). Included by every location that proxies to the app, since a
# location defining its own proxy_set_header does not inherit the server-level ones.
proxy_set_header Content-Security-Policy "";
proxy_set_header Content-Security-Policy-Report-Only "";
proxy_set_header X-Nonce "";
