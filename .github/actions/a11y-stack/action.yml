name: "Stack egapro pour la capture RGAA"
description: >-
  Prépare ce que la suite Playwright `src/e2e/a11y/` exige pour capturer des pages rendues et
  authentifiées : variables de la stack, dépendances, Chromium, services docker, build de
  production, schéma de base. Partagée par `a11y-pages` (a11y.yaml, run hebdomadaire) et
  `a11y-lite` (a11y-lite.yaml, chaque PR) : une seule préparation, donc une seule à corriger.
  Le checkout reste au workflow — une action locale n'existe qu'après lui.

# Les secrets ne sont exposés qu'au build. Le workflow les repasse lui-même à la step de
# capture, la seule autre qui fasse tourner l'app — jamais à l'Action ultra11y. Même découpage
# que le job `shard` d'e2e.yaml (#4699).
inputs:
  proconnect-client-id:
    description: "EGAPRO_PROCONNECT_CLIENT_ID"
    required: true
  proconnect-client-secret:
    description: "EGAPRO_PROCONNECT_CLIENT_SECRET"
    required: true
  proconnect-issuer:
    description: "EGAPRO_PROCONNECT_ISSUER"
    required: true
  weez-api-url:
    description: "EGAPRO_WEEZ_API_URL"
    required: true

runs:
  using: composite
  steps:
    # Écrites dans $GITHUB_ENV, donc visibles des steps SUIVANTES du job appelant — la capture
    # comprise. AUTH_SECRET est généré par run ; SUIT pointe vers un nom qui ne se résout pas.
    - name: Variables de la stack
      shell: bash
      run: |
        set -euo pipefail
        auth_secret=$(openssl rand -base64 32)
        echo "::add-mask::$auth_secret"
        {
          echo "AUTH_SECRET=$auth_secret"
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5438/egapro"
          echo "NEXTAUTH_URL=http://localhost:3000/api/auth"
          echo "EGAPRO_SUIT_API_URL=https://suit.invalid"
          echo "EGAPRO_GATEWAY_SHARED_SECRET=dev-gateway-shared-secret-minimum-32-chars"
          echo "EGAPRO_E2E_CLOCK=true"
          # Same test-only MFA seam as e2e.yaml (#4467, #4961): every sign-in now
          # demands a second factor, and the backoffice demands eidas2 besides.
          echo "EGAPRO_E2E_MFA=true"
          echo "S3_ENDPOINT=http://localhost:9000"
          echo "S3_REGION=us-east-1"
          echo "S3_ACCESS_KEY_ID=minioadmin"
          echo "S3_SECRET_ACCESS_KEY=minioadmin"
          echo "S3_BUCKET_NAME=egapro-dev-app"
          echo "CLAMAV_HOST=localhost"
          echo "CLAMAV_PORT=3310"
          echo "ADMIN_EMAILS=test@fia1.fr,ultimate@test.proconnect.gouv.fr,marie.durand@test.proconnect.gouv.fr"
          echo "EGAPRO_ADMIN_REQUIRE_PUBLIC_AGENT=false"
          echo "NOTIFICATIONS_DATABASE_URL=postgresql://postgres:postgres@localhost:5439/egapro_notifications"
          echo "MAIL_ENABLED=true"
          echo "SMTP_HOST=localhost"
          echo "SMTP_PORT=1025"
          echo "SMTP_SECURE=false"
          echo "MAIL_FROM=no-reply@egapro.local"
          echo "MAILDEV_URL=http://localhost:1080"
        } >> "$GITHUB_ENV"
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ".nvmrc"
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    # Une step d'action composite n'accepte pas `timeout-minutes` : chaque téléchargement est
    # borné par `curl --max-time`, chaque tentative d'apt par `timeout`, et le job par le sien.
    - name: Install Chromium manually (bypass Playwright extractor)
      shell: bash
      run: |
        set -euo pipefail
        # Ces deux constantes sont DICTÉES par la version de @playwright/test, elles ne se
        # choisissent pas : Playwright cherche le navigateur dans
        # ~/.cache/ms-playwright/chromium-<revision>, et refuse de démarrer si le dossier porte
        # une autre révision. Un bump de @playwright/test sans bump ici donne
        # « browserType.launch: Executable doesn't exist at .../chromium_headless_shell-<rev> »
        # (mesuré sur la PR #4408, 1.59.1 -> 1.62.1 : le cache restait sur 1217).
        # Les valeurs se lisent dans playwright-core/browsers.json de la version installée :
        #   jq '.browsers[] | select(.name=="chromium")' node_modules/playwright-core/browsers.json
        # -> revision = CHROMIUM_VERSION, browserVersion = CFT_BUILD.
        # e2e.yaml et e2e-grille.yaml portent le même bloc, et cette action le porte pour les
        # deux jobs d'accessibilité : les désaligner, c'est laisser rouge celui qu'on n'a pas
        # corrigé. C'est e2e.yaml qui fait foi.
        CHROMIUM_VERSION=1234
        CFT_BUILD=151.0.7922.34

        install_browser() {
          local zip_name="$1" dest_subdir="$2" extracted_dir="$3" final_dir="$4"
          local dest="$HOME/.cache/ms-playwright/${dest_subdir}"
          mkdir -p "$dest"
          echo "::group::Download ${zip_name}"
          time curl --fail --location --silent --show-error \
            --max-time 120 \
            -o "/tmp/${zip_name}" \
            "https://cdn.playwright.dev/builds/cft/${CFT_BUILD}/linux64/${zip_name}"
          ls -lh "/tmp/${zip_name}"
          echo "::endgroup::"
          echo "::group::Extract ${zip_name} with system unzip"
          time unzip -q "/tmp/${zip_name}" -d "$dest"
          if [ "$extracted_dir" != "$final_dir" ]; then
            mv "$dest/$extracted_dir" "$dest/$final_dir"
          fi
          touch "$dest/INSTALLATION_COMPLETE"
          rm "/tmp/${zip_name}"
          ls -la "$dest" | head -5
          echo "::endgroup::"
        }

        install_browser \
          "chrome-linux64.zip" \
          "chromium-${CHROMIUM_VERSION}" \
          "chrome-linux64" \
          "chrome-linux"

        install_browser \
          "chrome-headless-shell-linux64.zip" \
          "chromium_headless_shell-${CHROMIUM_VERSION}" \
          "chrome-headless-shell-linux64" \
          "chrome-headless-shell-linux64"
    - name: Install Playwright system dependencies
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
      run: |
        set -euo pipefail
        # APT SUR LE MIROIR AZURE EST CE QUI PEND — trois mesures pour en arriver là.
        #
        #  1. run 32290208703 : trois tentatives en CINQ SECONDES sur `dpkg/lock-frontend`.
        #     La boucle de retry ne dormait pas : elle relançait le même tirage.
        #  2. run 32296197686 : avec une attente, l'étape patiente quatre minutes puis meurt
        #     sur un TROISIÈME verrou, `/var/lib/apt/lists/lock`, non surveillé.
        #  3. run 32296977647 : avec `DPkg::Lock::Timeout`, la tentative 1 tourne SEPT MINUTES
        #     sans rendre la main (le timeout fonctionne, apt attend) avant d'être coupée, et
        #     la tentative 2 échoue en cinq secondes sur ce même verrou de `lists` — que
        #     `DPkg::Lock::Timeout` ne couvre pas. Le processus 2077 le tenait depuis plus de
        #     dix minutes : un `apt-get update` de fond bloqué sur le miroir Azure.
        #
        # C'est le même diagnostic que SocialGouv/ultra11y@7090f62 (« apt on the Azure mirror is
        # what hangs »), et la même conclusion : on ne fait pas dépendre la capture d'apt.
        #
        # Deux lignes de défense. D'abord on libère le verrou pour de bon — c'est une VM
        # jetable, le processus qu'on tue est un updater de fond dont ce job n'a aucun besoin.
        # Ensuite, si `install-deps` échoue quand même, on CONTINUE : l'image ubuntu-22.04
        # embarque Chrome et donc les bibliothèques partagées que Playwright réclame, et la
        # vraie preuve n'est pas ce qu'apt a répondu — c'est que le navigateur démarre, ce que
        # la capture vérifie immédiatement. Un miroir injoignable ne doit pas se présenter
        # comme un échec de tests.
        echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99-ultra11y-lock-timeout > /dev/null
        sudo systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
        sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
        sudo pkill -9 -f 'apt-get|apt\.systemd\.daily|unattended-upgrade' 2>/dev/null || true
        sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend
        sudo dpkg --configure -a > /dev/null 2>&1 || true
        for attempt in 1 2; do
          if timeout 300 pnpm --filter app exec playwright install-deps chromium; then
            echo "playwright install-deps: ok (tentative $attempt)"
            exit 0
          fi
          echo "::warning::playwright install-deps a échoué ou expiré (tentative $attempt/2)"
          sudo apt-get clean || true
          sleep 20
        done
        echo "::warning::playwright install-deps n'a pas abouti (apt injoignable ou verrouillé). On continue : l'image du runner embarque déjà Chrome et ses bibliothèques partagées, et le lancement du navigateur, juste après, est la vraie vérification."
        exit 0
    - name: Start services
      shell: bash
      run: docker compose up -d
    - name: Build
      shell: bash
      env:
        EGAPRO_PROCONNECT_CLIENT_ID: ${{ inputs.proconnect-client-id }}
        EGAPRO_PROCONNECT_CLIENT_SECRET: ${{ inputs.proconnect-client-secret }}
        EGAPRO_PROCONNECT_ISSUER: ${{ inputs.proconnect-issuer }}
        EGAPRO_WEEZ_API_URL: ${{ inputs.weez-api-url }}
      run: pnpm build
    - name: Apply database schema
      shell: bash
      run: pnpm db:push
