name: 🗓️ Ticket end date

# Stamps the "End date" column of the EGAPRO V2 project board when a ticket's
# PR is merged. The ticket number is parsed from the linked-branch convention
# `ticket/<N>-*` (created by scripts/orchestration/create_linked_branch.sh), so
# the final epic PR (`epic/<N>`) and human non-ticket branches are skipped.
#
# Auth: GitHub App token minted by SocialGouv/token-bureau (OIDC), same pattern
# as release.yml / promote-test-env.yaml. Writing an org Project V2 needs the
# org-level `organization_projects` permission, which the default GITHUB_TOKEN
# can never carry — hence the App token.
#
# PREREQUISITES (both are outside this repo):
#   1. token-bureau must GRANT the scope. Already configured: SocialGouv/infra-apps
#      `token-bureau/values.yaml` carries the `SocialGouv/egapro` override with
#      `organization_projects: write`, on image v0.0.9.
#   2. token-bureau must be DEPLOYED with that config. `applications/token-bureau.yaml`
#      has no `automated:` sync policy, so a values change stays in git until an
#      ArgoCD sync of `token-bureau-prod` (cluster ovh-prod, namespace token-bureau)
#      is triggered by hand.
#   3. The backing GitHub App must hold "Organization permissions → Projects:
#      Read and write", approved by an org owner on the SocialGouv installation.
#      Adding a permission to an App does NOT grant it retroactively.
#
# The `permissions:` input on the token step below is what makes a missing
# prerequisite name itself: token-bureau refuses the request explicitly instead
# of minting a token that silently cannot write.

on:
  pull_request:
    types: [closed]
  # Manual re-run, so the gate can be exercised without merging a real PR.
  # A manual run is deliberate: it overwrites an existing value (no --if-empty).
  workflow_dispatch:
    inputs:
      ticket:
        description: "Ticket number to stamp (e.g. 4072)"
        required: true
        type: string
      date:
        description: "Date to write (YYYY-MM-DD). Defaults to today."
        required: false
        type: string

permissions:
  contents: read # actions/checkout — the repo is public, but don't rely on it
  id-token: write # required for token-bureau OIDC

jobs:
  stamp-end-date:
    # pull_request: merged PRs on ticket branches only. workflow_dispatch: always.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'ticket/'))
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub App Token
        id: token
        uses: SocialGouv/token-bureau@main
        with:
          token-bureau-url: https://token-bureau.fabrique.social.gouv.fr
          audience: socialgouv
          # Least privilege, and a diagnostic. Each layer names itself on failure:
          #   "Invalid permission requested: organization_projects"
          #     -> deployed token-bureau server is older than v0.0.8
          #   "Permission organization_projects is not allowed for this repository"
          #     -> server is current but its permissions ConfigMap is stale
          #   HTTP 422 "permissions requested are not granted to this installation"
          #     -> the GitHub App installation lacks the org Projects permission
          # `issues: read` covers the issue lookup done by set_ticket_date.sh.
          permissions: '{"issues":"read","organization_projects":"write"}'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp End date
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          INPUT_TICKET: ${{ inputs.ticket }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_TICKET" ]; then
            N="$INPUT_TICKET"
            STAMP_DATE="$INPUT_DATE"
            IF_EMPTY=""
          else
            N="$(printf '%s' "$HEAD_REF" | sed -nE 's#^ticket/([0-9]+)-.*#\1#p')"
            STAMP_DATE="$(printf '%s' "$MERGED_AT" | cut -dT -f1)"
            IF_EMPTY="--if-empty"
          fi

          if [ -z "$N" ]; then
            echo "Head ref '$HEAD_REF' is not a ticket branch — skipping."
            exit 0
          fi

          echo "Stamping End date=${STAMP_DATE:-today} on ticket #$N"

          ARGS=("$N" end)
          if [ -n "$IF_EMPTY" ]; then
            ARGS+=("$IF_EMPTY")
          fi
          if [ -n "$STAMP_DATE" ]; then
            ARGS+=("$STAMP_DATE")
          fi
          bash scripts/orchestration/set_ticket_date.sh "${ARGS[@]}"
