name: 🎯 Promote test env

# Deploys a published release (including `-alpha.N` prereleases) onto one of
# the persistent test environments of the dev cluster (`rgaa-persist` /
# `perf-persist`). The Docker image is built from the release tag and pushed
# as `app:<version>`, then deployed straight to the target namespace with
# kontinuous — the pods reference a version like production, not a sha.
# Janitor never collects these namespaces: the deployed ref matches the
# kontinuous persist convention (plugins/contrib/lib/persist-convention.js).
# Promotion is manual only — these environments never track a branch.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to deploy (e.g. v3.4.0-alpha.2)"
        required: true
        type: string
      target:
        description: "Target persistent test environment"
        required: true
        type: choice
        options:
          - rgaa
          - perf

# Concurrent promotions to the same target are serialized (not cancelled, not
# deduplicated): runs execute in dispatch order, so the last dispatched release
# is the one that ends up deployed.
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ inputs.target }}

jobs:
  verify:
    name: "✅ Verify ${{ inputs.release }} is a published release"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⏬ Checkout code repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: ✅ Verify the tag is a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          case "$TAG" in
            v*) ;;
            *)
              echo "::error::'$TAG' does not look like a release tag (expected v*)"
              exit 1
              ;;
          esac
          if ! git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" > /dev/null; then
            echo "::error::Tag '$TAG' does not exist on this repository"
            exit 1
          fi
          if ! IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            echo "::error::No GitHub release found for tag '$TAG'"
            exit 1
          fi
          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error::The GitHub release for '$TAG' is a draft — publish it first"
            exit 1
          fi

  build-app:
    name: "📦 Build image app:${{ inputs.release }}"
    needs: verify
    runs-on: ubuntu-latest
    environment: build-review-auto
    permissions:
      contents: read
      id-token: write # OIDC identity for buildkit-operator /route auth
    steps:
      - name: ⏬ Checkout code repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release }}

      - name: 📌 Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY_URL }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}/app
          tags: |
            type=raw,value=${{ inputs.release }}

      - name: 🔑 Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 📦 Build and push Docker image for app
        uses: socialgouv/buildkit-operator@v1
        with:
          buildd-url: ${{ vars.BUILDKIT_OPERATOR_BUILDD_URL }}
          gateway-host: ${{ vars.BUILDKIT_OPERATOR_GATEWAY_HOST }}
          ca: ${{ secrets.BUILDKIT_OPERATOR_CA }}
          cert: ${{ secrets.BUILDKIT_OPERATOR_CERT }}
          key: ${{ secrets.BUILDKIT_OPERATOR_KEY }}
          context: "."
          file: "packages/app/Dockerfile"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_EGAPRO_ENV=dev
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_MATOMO_URL=${{ vars.NEXT_PUBLIC_MATOMO_URL }}
            NEXT_PUBLIC_MATOMO_SITE_ID=${{ vars.NEXT_PUBLIC_MATOMO_SITE_ID_DEV }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
            sentry_release=${{ inputs.release }}
            app_version=${{ inputs.release }}
          push: true

  deploy:
    name: "🐳 Deploy ${{ inputs.release }} → ${{ inputs.target }}-persist"
    needs: build-app
    runs-on: ubuntu-latest
    environment: review-auto
    permissions:
      contents: read
    steps:
      # The manifests deployed must be the ones of the promoted version, so
      # the checkout is done on the release tag, not on the workflow ref.
      - name: ⏬ Checkout code repository
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release }}
          fetch-depth: 0

      # KS_GIT_BRANCH drives the kontinuous naming: namespace
      # `egapro-<target>-persist`, `kontinuous/ref` labels and the janitor
      # persist exemption — without any real git branch involved.
      # `inlineSet` is the final values override: it replaces the
      # `persist-<sha>` image tag computed by the kontinuous dev defaults
      # with the version tag built above.
      - name: 🐳 Deploy on Kubernetes
        uses: socialgouv/kontinuous/.github/actions/deploy-via-github@v1
        env:
          KS_GIT_BRANCH: ${{ inputs.target }}-persist
        with:
          environment: dev
          kubeconfig: ${{ secrets.KUBECONFIG }}
          inlineSet: "global.imageTag: ${{ inputs.release }}"
          sentryDSN: ${{ secrets.KS_SENTRY_DSN }}
          notifyWebhookUrl: ${{ secrets.KS_NOTIFY_MATTERMOST_WEBHOOK_URL }}
          projectName: ${{ vars.KS_PROJECT_NAME }}
          ciNamespace: ${{ vars.KS_CI_NAMESPACE }}

      - name: 🌐 Compute environment URL
        id: env
        uses: socialgouv/kontinuous/.github/actions/env@v1
        with:
          branch: ${{ inputs.target }}-persist

      - name: 📝 Job summary
        env:
          TAG: ${{ inputs.release }}
          TARGET: ${{ inputs.target }}-persist
          SUBDOMAIN: ${{ steps.env.outputs.subdomain }}
        run: |
          {
            echo "## Promotion ${TAG} → ${TARGET}"
            echo ""
            echo "- Release : [\`${TAG}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            echo "- Image : \`app:${TAG}\`"
            echo "- URL : <https://${SUBDOMAIN}.ovh.fabrique.social.gouv.fr>"
          } >> "$GITHUB_STEP_SUMMARY"
