name: 🎯 Promote test env

# Deploys a published release (including `-alpha.N` prereleases) onto one of
# the persistent test environments of the dev cluster (`rgaa-persist` /
# `perf-persist` / `recette-persist`). The Docker image is built from the
# release tag and pushed as `app:<version>`, then deployed straight to the target namespace with
# kontinuous — the pods reference a version like production, not a sha.
# Janitor never collects these namespaces: the deployed ref matches the
# kontinuous persist convention (plugins/contrib/lib/persist-convention.js).
# Promotion is manual only — these environments never track a branch.
# `campaign_year` pins the campaign year of the deployed app for manual
# recette (EGAPRO_RECETTE_CAMPAIGN_YEAR, refused at boot by non-dev builds).

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to deploy (e.g. v3.14.0-alpha.12)"
        required: true
        type: string
      target:
        description: "Target persistent test environment"
        required: true
        type: choice
        options:
          - rgaa
          - perf
          - recette
      campaign_year:
        description: "Campaign year pinned for manual recette (e.g. 2030) — leave empty for the real calendar year"
        required: false
        type: string
        default: ""

# Concurrent promotions to the same target are serialized (not cancelled, not
# deduplicated): runs execute in dispatch order, so the last dispatched release
# is the one that ends up deployed.
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ inputs.target }}

permissions:
  contents: read

jobs:
  verify:
    name: "✅ Verify ${{ inputs.release }} is a published release"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⏬ Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: ✅ Verify the pinned campaign year
        env:
          CAMPAIGN_YEAR: ${{ inputs.campaign_year }}
        run: |
          # Bounds mirror EGAPRO_RECETTE_CAMPAIGN_YEAR (env.js), pinned by env.test.ts.
          if [ -n "$CAMPAIGN_YEAR" ]; then
            if ! [[ "$CAMPAIGN_YEAR" =~ ^[0-9]{4}$ ]] \
              || [ "$CAMPAIGN_YEAR" -lt 2027 ] || [ "$CAMPAIGN_YEAR" -gt 2100 ]; then
              echo "::error::campaign_year must be a 4-digit year between 2027 and 2100"
              exit 1
            fi
          fi

      - name: ✅ Verify the tag is a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          case "$TAG" in
            v*) ;;
            *)
              echo "::error::'$TAG' does not look like a release tag (expected v*)"
              exit 1
              ;;
          esac
          if ! git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" > /dev/null; then
            # Listing the latest tags turns the most common failure — a typo in
            # the version series — into a one-glance fix.
            echo "::error::Tag '$TAG' does not exist on this repository. Latest tags: $(git tag --sort=-creatordate | head -5 | tr '\n' ' ')"
            exit 1
          fi
          if ! IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            echo "::error::No GitHub release found for tag '$TAG'"
            exit 1
          fi
          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error::The GitHub release for '$TAG' is a draft — publish it first"
            exit 1
          fi

      - name: ✅ Verify the release honours the pinned campaign year
        if: inputs.campaign_year != ''
        env:
          TAG: ${{ inputs.release }}
        run: |
          if ! git grep -q EGAPRO_RECETTE_CAMPAIGN_YEAR "refs/tags/$TAG" -- packages/app/src/env.js; then
            echo "::error::Release '$TAG' predates EGAPRO_RECETTE_CAMPAIGN_YEAR — promote a newer release or leave campaign_year empty"
            exit 1
          fi

  build-app:
    name: "📦 Build image app:${{ inputs.release }}"
    needs: verify
    runs-on: ubuntu-latest
    environment: build-review-auto
    permissions:
      contents: read
      id-token: write # OIDC identity for buildkit-operator /route auth
    steps:
      - name: ⏬ Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release }}

      - name: 📌 Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ vars.REGISTRY_URL }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}/app
          tags: |
            type=raw,value=${{ inputs.release }}

      - name: 🔑 Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 📦 Build and push Docker image for app
        uses: socialgouv/buildkit-operator@42071022f7c68070aeba92e8c30e95d8564eeb53 # v1
        with:
          buildd-url: ${{ vars.BUILDKIT_OPERATOR_BUILDD_URL }}
          gateway-host: ${{ vars.BUILDKIT_OPERATOR_GATEWAY_HOST }}
          ca: ${{ secrets.BUILDKIT_OPERATOR_CA }}
          cert: ${{ secrets.BUILDKIT_OPERATOR_CERT }}
          key: ${{ secrets.BUILDKIT_OPERATOR_KEY }}
          context: "."
          file: "packages/app/Dockerfile"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_EGAPRO_ENV=dev
            NEXT_PUBLIC_DEV_FILL_ENABLED=true
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_MATOMO_URL=${{ vars.NEXT_PUBLIC_MATOMO_URL }}
            NEXT_PUBLIC_MATOMO_SITE_ID=${{ vars.NEXT_PUBLIC_MATOMO_SITE_ID_DEV }}
            APP_VERSION=${{ inputs.release }}
            SENTRY_RELEASE=${{ inputs.release }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          push: true

  deploy:
    name: "🐳 Deploy ${{ inputs.release }} → ${{ inputs.target }}-persist"
    needs: build-app
    runs-on: ubuntu-latest
    # `name` carries the deploy secrets (KUBECONFIG, KS_*). `url` is what makes
    # the promotion auditable: the workflow runs on `alpha`, so the deployment
    # record GitHub writes is `review-auto @ alpha` and any downstream job that
    # recomputes an URL from that ref targets the alpha env. Declaring the URL
    # here propagates it as `deployment_status.environment_url`, which the
    # Lighthouse workflow prefers over its own computation.
    environment:
      name: review-auto
      url: https://egapro-${{ inputs.target }}-persist.ovh.fabrique.social.gouv.fr
    permissions:
      contents: read
    steps:
      # The manifests deployed must be the ones of the promoted version, so
      # the checkout is done on the release tag, not on the workflow ref.
      - name: ⏬ Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release }}
          fetch-depth: 0

      # KS_GIT_BRANCH drives the kontinuous naming: namespace
      # `egapro-<target>-persist`, `kontinuous/ref` labels and the janitor
      # persist exemption — without any real git branch involved.
      # `inlineSet` is the final values override: it replaces the
      # `persist-<sha>` image tag computed by the kontinuous dev defaults
      # with the version tag built above, and adds the pinned campaign year
      # to the app container's `vars` when one was requested (quoted: the app
      # chart renders each var through `tpl`, which needs a string).
      - name: 🧩 Compute values override
        id: values
        env:
          TAG: ${{ inputs.release }}
          CAMPAIGN_YEAR: ${{ inputs.campaign_year }}
        run: |
          {
            echo "inline_set<<EOF"
            echo "global.imageTag: ${TAG}"
            if [ -n "$CAMPAIGN_YEAR" ]; then
              echo "app.vars.EGAPRO_RECETTE_CAMPAIGN_YEAR: \"${CAMPAIGN_YEAR}\""
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 🐳 Deploy on Kubernetes
        uses: socialgouv/kontinuous/.github/actions/deploy-via-github@1198b39082008127fd639ddc1700eb9315bb8ff3 # v1.188.0
        env:
          KS_GIT_BRANCH: ${{ inputs.target }}-persist
        with:
          environment: dev
          kubeconfig: ${{ secrets.KUBECONFIG }}
          inlineSet: ${{ steps.values.outputs.inline_set }}
          sentryDSN: ${{ secrets.KS_SENTRY_DSN }}
          notifyWebhookUrl: ${{ secrets.KS_NOTIFY_MATTERMOST_WEBHOOK_URL }}
          projectName: ${{ vars.KS_PROJECT_NAME }}
          ciNamespace: ${{ vars.KS_CI_NAMESPACE }}

      - name: 🌐 Compute environment URL
        id: env
        uses: socialgouv/kontinuous/.github/actions/env@1198b39082008127fd639ddc1700eb9315bb8ff3 # v1.188.0
        with:
          branch: ${{ inputs.target }}-persist

      - name: 📝 Job summary
        env:
          TAG: ${{ inputs.release }}
          TARGET: ${{ inputs.target }}-persist
          SUBDOMAIN: ${{ steps.env.outputs.subdomain }}
          CAMPAIGN_YEAR: ${{ inputs.campaign_year }}
        run: |
          {
            echo "## Promotion ${TAG} → ${TARGET}"
            echo ""
            echo "- Release : [\`${TAG}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            echo "- Image : \`app:${TAG}\`"
            echo "- URL : <https://${SUBDOMAIN}.ovh.fabrique.social.gouv.fr>"
            if [ -n "$CAMPAIGN_YEAR" ]; then
              echo "- Année de campagne épinglée : **${CAMPAIGN_YEAR}**"
            else
              echo "- Année de campagne : année civile réelle (aucun épinglage)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
