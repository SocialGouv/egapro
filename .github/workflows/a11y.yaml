name: "♿ Accessibilité (ultra11y RGAA)"

# Gate d'accessibilité RGAA 4.1.2 / WCAG 2.2 AA, entièrement portée par l'Action ultra11y.
# Le moteur est EMBARQUÉ dans l'Action : rien à installer, et aucune version à maintenir
# alignée côté repo. Trois tiers :
#
#   a11y-gate    CODE     — audit statique JSX/TSX du package. Bloquant, et MUET : il ne
#                           produit ni rapport, ni artefact, ni commentaire. Il fait rougir ou
#                           verdir, et laisse les annotations en ligne et le SARIF sur la diff.
#   a11y-pages   RENDU    — la suite Playwright dédiée balaye les pages, en épinglant l'état
#                           applicatif que chaque écran de tunnel exige ; l'Action réingère
#                           les instantanés, tourne le MÊME audit du code, et produit LE
#                           rapport page par page, les crops de preuve, l'adjudication IA des
#                           critères de jugement, LE commentaire et LE livrable.
#                           Les CONSTATS ne bloquent pas — on mesure. Une panne, si ; et
#                           depuis `require-decided: pages`, une grille incomplète aussi.
#
# Il n'y a plus de `a11y-report` hebdomadaire séparé : `a11y-pages` tourne déjà sur `schedule`
# et sur `workflow_dispatch`, et produit le même livrable AVEC le navigateur, donc en mieux.
# Ce qu'on perd en le supprimant, dit franchement : le plancher « sans docker, sans base, sans
# navigateur » qui sortait un rapport daté même quand la stack tombait. C'est le prix du
# livrable unique, et `require-sample` fait déjà rougir un balayage amputé.
#
# Le tier LIGHTHOUSE (score a11y 100 %) reste dans lighthouse.yaml.
#
# REGISTRE DE VERDICTS — comment la CI rend la grille COMPLÈTE sans modèle.
#
# Les critères que le moteur ne peut pas trancher (pertinence des alt, intitulé de lien dans son
# contexte, ordre de lecture) restaient « à évaluer » dans une CI sans agent. La réponse n'est
# pas de payer une passe IA sur chaque PR — mesuré : 16 à 21 $ par run, et deux runs sur le même
# commit pouvaient donner deux grilles différentes — mais de VERSIONNER les verdicts :
#
#   packages/app/.ultra11y/verdicts/rgaa.json
#
# L'Action le REJOUE (`ledger:`) avant toute adjudication. Ce n'est pas un cache : chaque verdict
# repasse la même porte, sur l'évidence re-dérivée de l'audit du moment — mêmes contrôles de
# couverture, mêmes citations à prouver, mêmes refus. Un verdict qu'on ne peut plus prouver est
# refusé en CI exactement comme il le serait en session, et un verdict dont l'évidence a changé
# est déclaré PÉRIMÉ : son critère retourne « à évaluer » en le disant, jamais reconduit en
# silence.
#
# Conséquence sur les événements :
#   - sur TOUTE PR, et sur le run hebdo comme sur le manuel, `adjudicate: agent` tranche ce que
#     le rejeu n'a pas couvert, via une passe Claude Code avec le secret CLAUDE_CODE_OAUTH_TOKEN
#     déjà utilisé par claude-question.yml — même harness, même token que dans une session
#     locale. Le registre mis à jour part dans le livrable, à relire puis committer.
#
#     Le rejeu tourne AVANT l'adjudication, donc chaque run ne fait trancher que le reliquat :
#     plus le registre committé est complet, moins une PR coûte, et sur un registre à jour elle
#     ne coûte rien du tout. C'est ce qui rend ce câblage tenable — mesuré avant registre :
#     16 à 21 $ par run.
#   - sur `push` (alpha, beta, master), l'adjudication ne peut PAS tourner : claude-code-action
#     refuse cet événement, et l'Action le détecte et dégrade en avertissement. C'est le REJEU
#     du registre committé qui y rend la grille complète — sans modèle, sans coût, et de façon
#     reproductible. Raison de plus pour committer le registre plutôt que de le laisser vivre
#     en artefact.
#   - `gate-adjudicated` reste à false : la gate ré-audite la SOURCE, donc le rouge/vert reste
#     une fonction pure du commit, quoi qu'un modèle ait dit.
#   - l'adjudication ne tourne PAS sur `push` : claude-code-action refuse cet event. L'Action le
#     détecte et dégrade en warning — d'où le rafraîchissement porté par a11y-pages (hebdo +
#     manuel) et non par la gate. Le REJEU, lui, tourne partout : il n'a besoin d'aucun modèle.
#
# CE QUE LE REGISTRE NE FAIT PAS : rendre la grille complète à lui seul.
#
# Le rejeu couvre ce qui a déjà été tranché. Ce qui a fermé le reste n'est pas le registre mais
# le MOTEUR : il décide désormais par page ce qu'il a mesuré par page, au lieu de ne savoir que
# répéter le verdict du run. Un critère non conforme sur une route est tranché POUR LE RUN, et
# sur les trente-six autres — celles que les mêmes sondes venaient de zoomer, de reflower, de
# parcourir au clavier — il retombait « à évaluer ». Mesuré sur l'audit réel de cette PR : 9
# critères ouverts sur la page d'accueil, dont 7 exactement de cette forme. Ils tombent.
#
# `require-decided` est donc passé à `pages`, et ce tier peut rougir : le zéro « à évaluer » est
# une invariante gardée, pas un affichage. Ce qui reste ouvert est NOMMÉ — dans le commentaire,
# dans le log, dans la fiche par page — et se ferme par l'adjudication ou par une entrée motivée
# dans `undecidable.json`.
#
# CE QUE L'AMONT A CORRIGÉ EN 5.8.0, et qui se voit ici :
#   - une sonde `hover` sans timeout suspendait le test appelant jusqu'à sa mort à 120 s. Deux
#     specs en sont mortes, et leur groupe série a emporté 15 tests avec elles : 20 pages
#     enregistrées au lieu de 35, à chaque run. Les sondes sont désormais bornées (timeout par
#     interaction, budget mural, plafond de déclencheurs) et ce qu'un budget coupe est déclaré.
#   - `sweepSample` n'exécutait aucune sonde : les 15 pages qu'il détient n'étaient pas
#     mesurées, et la conformité de ces critères étant un ET sur TOUTES les pages du périmètre,
#     zoom / reflow / espacement / survol restaient « à évaluer » pour l'audit entier — y
#     compris sur les 5 pages qui, elles, étaient sondées. Il sonde maintenant par défaut.
#   - ce qu'une sonde a mesuré compte enfin comme couverture, donc le rapport cesse d'annoncer
#     « Audit partiel — les critères à restituer n'ont pas été testés » sur un run qui les a
#     testés.
#   - un critère dont le SUJET est absent de tout le périmètre (aucun tableau, aucun champ de
#     formulaire, aucune image) est « non applicable » et non « à évaluer » : un thème entier
#     cesse d'être listé comme du travail à faire quand il n'y a rien à regarder.

on:
  push:
    branches: [alpha, beta, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # lundi 06:00 UTC — rapport RGAA hebdomadaire (artefact)
  workflow_dispatch:

concurrency:
  # Le run planifié tourne sur la ref par défaut : sans la distinguer, un push du lundi matin
  # annulait le rapport RGAA hebdomadaire, qui est un livrable et pas un feedback de PR.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"

permissions:
  contents: read
  actions: read # lire les runs passés pour récupérer l'artefact du registre de verdicts
  security-events: write # SARIF → code scanning ; sans ça les annotations prennent le relais
  pull-requests: write # commentaire de PR sticky

jobs:
  a11y-gate:
    name: "RGAA · audit statique du code (bloquant)"
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ultra11y — audit RGAA statique
        uses: maxgfr/ultra11y@feat/single-a11y-deliverable
        with:
          working-directory: packages/app
          # `src` et NON `src/**/*.tsx` : l'Action interpole `paths` sans quotes dans bash,
          # qui expanserait le glob lui-même en 6 fichiers (src/app/*.tsx) au lieu des 300
          # du package. Le répertoire laisse le moteur faire son propre globbing.
          paths: src
          # Le défaut `auto` bascule en mode diff sur une PR ; on garde le scope complet.
          since: ""
          jsx: "true"
          graph: "true"
          standard: rgaa
          lang: fr
          # Le registre est rejoué ici aussi, pour que le digest de la gate parle de la MÊME
          # grille que le rapport page par page. Aucun modèle n'intervient, et le rouge/vert ne
          # change pas : `fail-on: blocking` mord sur les constats du moteur, et l'Action
          # ré-audite la source pour décider (gate-adjudicated est false par défaut), donc un
          # verdict adjugé ne peut ni faire rougir ni faire verdir ce job.
          ledger: .ultra11y/verdicts/rgaa.json
          fail-on: blocking
          # CETTE GATE NE PRODUIT PLUS RIEN — elle fait rougir ou verdir, c'est tout.
          #
          # Elle postait un commentaire et uploadait un rapport complet, et `a11y-pages` aussi :
          # deux commentaires sticky sur la PR et deux arborescences de rapport dans le ZIP,
          # dont un lecteur qui veut « le rapport d'accessibilité de ce run » devait deviner
          # laquelle ouvrir. Pire, le sien était FAUX par construction : sans instantané de page
          # il annonçait 92 % (15/106) avec 91 critères « à évaluer » là où le tier page en
          # décidait 104 sur 106 — le même dépôt, le même commit, deux chiffres.
          #
          # Rien n'est perdu : `a11y-pages` tourne le MÊME audit du code (`paths: src`, `--jsx`,
          # `--graph`) avant d'y fondre les instantanés, donc son livrable contient tout ce que
          # celui-ci portait, et ses constats non rattachés à une page ont désormais leur propre
          # bloc dans le commentaire. Ce job garde les annotations en ligne et le SARIF, qui
          # s'affichent sur la diff et ne sont pas des livrables.
          report: "false"
          html: "false"
          comment: "false"

  a11y-pages:
    name: "RGAA · rapport page par page (non bloquant)"
    # Tout SAUF une PR de fork. Ce tier a besoin de la stack complète — base, S3, ProConnect —
    # et les secrets ne sont pas exposés à un fork : le job n'échouerait pas sur un constat
    # d'accessibilité, il mourrait au `Build` en disant autre chose que ce qu'il mesure. Le
    # tier CODE (`a11y-gate`), lui, n'a besoin d'aucun secret et couvre les forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # TOUTES les PR, et pas seulement celles qui visent `alpha` : une PR vers `beta` ou
    # `master` touche le même code et mérite la même revue. Plus les push (alpha/beta/master),
    # le run hebdomadaire et le déclenchement manuel — autrement dit, partout où ce workflow
    # tourne. Les CONSTATS d'accessibilité ne font toujours pas rougir (`fail-on: ""`) ; ce qui
    # rougit maintenant, c'est une grille incomplète (`require-decided: pages`) ou un balayage
    # amputé (`require-sample`) — deux faits sur la QUALITÉ DU RUN, pas sur le code audité.
    runs-on: ubuntu-22.04
    # Mesuré : 34 min pour 17 pages et une adjudication plafonnée à 60 tours ; 40 min pour le
    # run complet. Le balayage enregistre aujourd'hui **35 pages** (les 24 de l'échantillon
    # normatif, moins les 5 portées par un spec dédié, plus les écrans intermédiaires des
    # tunnels), et un job annulé sur timeout emporte le rapport ET l'artefact, ce que
    # `continue-on-error` n'absorbe pas — d'où la marge.
    #
    # Depuis le registre de verdicts, une PR ne paie plus d'adjudication du tout (elle rejoue),
    # donc ce budget ne sert plus qu'aux runs hebdo et manuels, les seuls à faire trancher les
    # critères périmés ou jamais tranchés.
    # TROIS PASSES D'ADJUDICATION NE TIENNENT PAS EN 75 MINUTES. Mesuré : le job a été coupé
    # à 75:00 pile en pleine adjudication, et un job annulé emporte le rapport ET l'artefact —
    # ce que `continue-on-error` n'absorbe pas. Le budget est donc calé sur le pire cas :
    # ~20 min d'infrastructure (build, base, navigateur), ~10 min de balayage, puis jusqu'à
    # trois passes de modèle. Large exprès : un job qui finit trop tôt ne coûte rien, un job
    # coupé coûte le livrable entier.
    timeout-minutes: 300
    # Ce tier MESURE : `fail-on: ""` sur l'Action, donc aucun constat d'accessibilité ne fait
    # rougir la PR. Ce n'est pas la même chose que masquer le job. `continue-on-error` au
    # niveau du JOB avalait aussi les pannes d'infra — build, base, ProConnect, crash de
    # l'Action — et une PR de fork, où les secrets sont vides, mourait au build en restant
    # verte, sans le moindre rapport. Le masque est donc porté par la seule step de balayage,
    # là où il sert : un écran qui coince ne doit pas coûter le rapport des autres.
    # L'audit page par page a besoin de l'app RENDUE et AUTHENTIFIÉE (le tunnel de déclaration
    # est derrière ProConnect), donc de la même stack que la suite E2E. Les étapes
    # d'infrastructure ci-dessous sont volontairement alignées sur .github/workflows/e2e.yaml —
    # c'est ce fichier qui fait foi pour le pin Chromium (CFT_BUILD).
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5438/egapro
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:3000/api/auth
      EGAPRO_PROCONNECT_CLIENT_ID: ${{ secrets.EGAPRO_PROCONNECT_CLIENT_ID }}
      EGAPRO_PROCONNECT_CLIENT_SECRET: ${{ secrets.EGAPRO_PROCONNECT_CLIENT_SECRET }}
      EGAPRO_PROCONNECT_ISSUER: ${{ secrets.EGAPRO_PROCONNECT_ISSUER }}
      EGAPRO_WEEZ_API_URL: ${{ secrets.EGAPRO_WEEZ_API_URL }}
      EGAPRO_SUIT_API_URL: ${{ secrets.EGAPRO_SUIT_API_URL }}
      EGAPRO_GATEWAY_SHARED_SECRET: dev-gateway-shared-secret-minimum-32-chars
      EGAPRO_E2E_CLOCK: "true"
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: egapro-dev-app
      CLAMAV_HOST: localhost
      CLAMAV_PORT: 3310
      ADMIN_EMAILS: test@fia1.fr
      NOTIFICATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5439/egapro_notifications
      MAIL_ENABLED: "true"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      MAIL_FROM: no-reply@egapro.local
      MAILDEV_URL: http://localhost:1080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium manually (bypass Playwright extractor)
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          CHROMIUM_VERSION=1217
          CFT_BUILD=147.0.7727.15

          install_browser() {
            local zip_name="$1" dest_subdir="$2" extracted_dir="$3" final_dir="$4"
            local dest="$HOME/.cache/ms-playwright/${dest_subdir}"
            mkdir -p "$dest"
            echo "::group::Download ${zip_name}"
            time curl --fail --location --silent --show-error \
              --max-time 120 \
              -o "/tmp/${zip_name}" \
              "https://cdn.playwright.dev/builds/cft/${CFT_BUILD}/linux64/${zip_name}"
            ls -lh "/tmp/${zip_name}"
            echo "::endgroup::"
            echo "::group::Extract ${zip_name} with system unzip"
            time unzip -q "/tmp/${zip_name}" -d "$dest"
            if [ "$extracted_dir" != "$final_dir" ]; then
              mv "$dest/$extracted_dir" "$dest/$final_dir"
            fi
            touch "$dest/INSTALLATION_COMPLETE"
            rm "/tmp/${zip_name}"
            ls -la "$dest" | head -5
            echo "::endgroup::"
          }

          install_browser \
            "chrome-linux64.zip" \
            "chromium-${CHROMIUM_VERSION}" \
            "chrome-linux64" \
            "chrome-linux"

          install_browser \
            "chrome-headless-shell-linux64.zip" \
            "chromium_headless_shell-${CHROMIUM_VERSION}" \
            "chrome-headless-shell-linux64" \
            "chrome-headless-shell-linux64"
      # `install-deps` is an `apt-get install`, and apt on a runner is occasionally slow enough
      # to blow a 5-minute budget. Mesuré sur le run 32069120308 : cette étape a expiré à
      # exactement 5:00 — pendant que le job E2E, qui exécute la MÊME commande sur le MÊME
      # commit, passait. Ce n'est donc pas une dépendance cassée, c'est un miroir lent, et une
      # tentative unique en fait un tirage au sort. Or les étapes 8 à 12 sont sautées quand
      # celle-ci échoue : plus d'instantané, plus de grille par page, plus d'adjudication —
      # tout le tier disparaît à cause d'apt.
      #
      # Trois tentatives sous un budget plus large : un flake coûte un retry, une vraie panne
      # échoue toujours. Le `timeout` par tentative est ce qui rend le retry possible — sans
      # lui, la première tentative consommerait tout le budget du step.
      - name: Install Playwright system dependencies
        timeout-minutes: 14
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout 240 pnpm --filter app exec playwright install-deps chromium; then
              echo "playwright install-deps: ok (tentative $attempt)"
              exit 0
            fi
            echo "::warning::playwright install-deps a échoué ou expiré (tentative $attempt/3) — nouvelle tentative"
            sudo apt-get clean || true
          done
          echo "::error::playwright install-deps a échoué après 3 tentatives"
          exit 1
      - name: Start services
        run: docker compose up -d
      - name: Build
        run: pnpm build
      - name: Apply database schema
        run: pnpm db:push
      # Le balayage est piloté par PLAYWRIGHT, pas par `scan --sample`. Ce n'est pas un
      # détail d'implémentation : les écrans du tunnel sont gardés par la machine à états, et
      # chacun n'est ouvert que depuis un état de déclaration précis — l'étape 2 veut un
      # brouillon, le parcours de conformité veut une déclaration transmise. Un balayage qui
      # visite des URL en une passe, sous un état unique, ne peut structurellement pas les
      # produire : il obtient une redirection (ou un 404 rendu sur place) et, correctement,
      # refuse de l'enregistrer. La suite Playwright, elle, épingle l'état avant chaque écran
      # et passe par une vraie soumission là où la FSM l'exige.
      #
      # `playwright.a11y.config.ts` porte son propre projet `setup` (connexion ProConnect) et
      # démarre l'app par le bloc `webServer` de la config de base — d'où l'absence de step
      # « démarrer l'app » ici.
      #
      # `continue-on-error` sur CETTE step seulement : un écran qui coince ne doit pas coûter
      # le rapport et l'artefact des 34 autres. Une panne d'infra, elle, reste rouge.
      - name: ultra11y — balayage RGAA des pages (Playwright)
        continue-on-error: true
        timeout-minutes: 25
        run: pnpm --filter app test:e2e:a11y
      # LE REGISTRE, RÉCUPÉRÉ DEPUIS L'ARTEFACT DU DERNIER RUN QUI L'A PRODUIT.
      #
      # Sans cette step, le choix « le registre reste en artefact, jamais committé » ne tient
      # pas debout : `ledger:` pointe sur un fichier absent, le rejeu ne rejoue rien, et le
      # job est rouge sur CHAQUE PR quoi qu'il arrive. Un contrôle qui ne peut pas passer est
      # un contrôle qu'on apprend à ignorer — exactement ce que la porte de complétude existe
      # pour empêcher.
      #
      # On va donc chercher le dernier run RÉUSSI de ce workflow sur la branche de base (c'est
      # `a11y-pages` en hebdo/manuel qui enrichit le registre, jamais une PR) et on en extrait
      # l'artefact. Best-effort de bout en bout : pas d'artefact, pas de run, pas de droits →
      # on continue sans, les critères restent « à évaluer » et le job le dit.
      #
      # Ce que ça coûte, dit franchement : un artefact n'est pas relu comme un fichier
      # committé. Des verdicts de modèle entrent donc dans la grille publiée sans être passés
      # en revue, et les artefacts expirent (30 jours ici) — le jour où le dernier a disparu,
      # la PR redevient rouge sans que rien n'ait changé dans le code. Committer le registre
      # reste la position défendable ; ceci est le compromis qui rend l'autre choix vivable.
      - name: Restaurer le registre de verdicts du dernier run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref || github.ref_name }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          mkdir -p packages/app/.ultra11y/verdicts
          # Le registre est VERSIONNÉ ; cette étape n'est qu'un rattrapage, pour le cas où un
          # run hebdo aurait tranché des critères que le fichier committé ne porte pas encore.
          # Elle ne doit jamais écraser un registre committé plus riche que l'artefact.
          committed=$(node -p "try{JSON.parse(require('fs').readFileSync('packages/app/.ultra11y/verdicts/rgaa.json','utf8')).entries.length}catch{0}")
          # Les DEUX branches, et la branche de tête d'abord : c'est `a11y-pages` en hebdo ou en
          # manuel qui enrichit le registre, et ces runs-là tournent sur la branche où l'on
          # travaille — pas sur `alpha`, où ce job ne tourne jamais (son `if` exclut `push`).
          # Ne regarder que `github.base_ref` cherchait donc l'artefact exactement là où il ne
          # pouvait pas être : mesuré sur cette PR, l'artefact existait sur la branche de tête
          # et le job a rapporté « la grille partira vide » à chaque run.
          for branch in "${HEAD_REF:-}" "$BASE"; do
            [ -n "$branch" ] || continue
            run_id=$(gh run list --workflow=a11y.yaml --branch "$branch" --status success \
              --limit 30 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            [ -n "$run_id" ] || continue
            tmp=$(mktemp -d)
            # DEPUIS LE LIVRABLE FUSIONNÉ, et non depuis la partie.
            #
            # `a11y-bundle` fusionne les `ultra11y-part-*` en un seul `ultra11y-rgaa` avec
            # `delete-merged: true` : au moment où cette étape tourne, la partie qui portait le
            # registre n'existe plus sous son propre nom. On lit donc le LIVRABLE, où l'Action a
            # recopié le registre à côté du rapport (`verdicts-rgaa.json`). Les noms précédents
            # sont essayés ensuite, pour un livrable produit avant ce changement.
            gh run download "$run_id" -n ultra11y-rgaa -D "$tmp" 2>/dev/null || continue
            # Une partie par répertoire depuis `separate-directories` ; on accepte encore la
            # racine, pour un livrable produit avant ce changement.
            led="$tmp/ultra11y-part-rgaa/verdicts-rgaa.json"
            # Les noms qu'ont portés les livrables précédents, dans l'ordre où on les a eus.
            [ -f "$led" ] || led="$tmp/ultra11y-part-pages/verdicts-rgaa.json"
            [ -f "$led" ] || led="$tmp/ultra11y-part-verdicts/rgaa.json"
            [ -f "$led" ] || led="$tmp/rgaa.json"
            [ -f "$led" ] || continue
            n=$(node -p "try{JSON.parse(require('fs').readFileSync('$led','utf8')).entries.length}catch{0}")
            if [ "$n" -gt "$committed" ]; then
              cp "$led" packages/app/.ultra11y/verdicts/rgaa.json
              echo "registre restauré depuis le run $run_id ($branch) — $n verdict(s), contre $committed committé(s)."
              exit 0
            fi
            echo "::notice::le run $run_id ($branch) porte $n verdict(s), le registre committé en porte $committed — on garde le committé."
            exit 0
          done
          echo "::notice::aucun artefact de registre à rattraper — le registre committé ($committed verdict(s)) fait foi." 

      # L'Action n'a plus besoin de `sample`/`storage-state`/`runtime` : `audit` réingère
      # `.ultra11y/pages/` tout seul dès que le répertoire existe. Elle fait le reste — audit
      # du code, ré-audit hors navigateur des instantanés, adjudication IA, rapport page par
      # page, crops de preuve, HTML, commentaire de PR.
      - name: ultra11y — audit, rapport page par page et adjudication
        uses: maxgfr/ultra11y@feat/single-a11y-deliverable
        env:
          # Lu depuis l'ENV DU JOB, jamais depuis un input : c'est ce qui rend le tier
          # inoffensif sur une PR de fork, où les secrets ne sont pas exposés — il se
          # désactive tout seul avec un warning.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          working-directory: packages/app
          paths: src
          since: ""
          jsx: "true"
          graph: "true"
          standard: rgaa
          lang: fr
          # LE REGISTRE DE VERDICTS — ce qui rend la grille complète en CI, sans modèle.
          #
          # `packages/app/.ultra11y/verdicts/rgaa.json` est versionné. L'Action le REJOUE avant
          # toute adjudication : chaque verdict repasse la même porte, sur l'évidence
          # re-dérivée de l'audit du moment, donc un verdict qu'on ne peut plus prouver est
          # refusé en CI exactement comme il le serait en session. Un verdict dont l'évidence a
          # changé est déclaré PÉRIMÉ et son critère retourne « à évaluer » en le disant — il
          # n'est jamais reconduit en silence.
          ledger: .ultra11y/verdicts/rgaa.json
          # …et l'adjudication payante ne tourne QUE hors PR. Le rejeu couvre déjà tout ce qui
          # est au registre, donc sur une PR il ne reste rien à faire trancher : la grille est
          # complète, déterministe et gratuite. Mesuré avant ce modèle : 16 à 21 $ par PR, pour
          # un résultat non reproductible d'un run à l'autre. Les runs hebdo et manuel gardent
          # l'adjudication pour RAFRAÎCHIR le registre (critères périmés ou jamais tranchés) ;
          # le registre mis à jour part dans l'artefact, à committer après relecture.
          adjudicate: agent
          # TROIS PASSES, et un budget de tours large. Mesuré : l'adjudicateur s'est arrêté à
          # 22 tours sur 228, sans erreur, en laissant 42 critères `verdict: null` — une passe
          # unique n'a aucun moyen d'y revenir, et le job finit vert sur une grille que
          # personne n'a remplie. Chaque passe supplémentaire ne reprend que ce qui est ENCORE
          # indécis (jamais atteint, ou jugé puis refusé par la porte en portant son motif),
          # donc elle coûte le reliquat et rien d'autre — et un run qui a tout décidé saute les
          # suivantes avant d'invoquer le moindre modèle.
          adjudicate-passes: "3"
          adjudicate-max-turns: "600"
          # La gate ré-audite la source : un verdict de modèle ne peut pas faire rougir la CI.
          gate-adjudicated: "false"
          fail-on: "" # le verdict d'accessibilité ne bloque pas — on mesure
          # LA COMPLÉTUDE EST DÉSORMAIS IMPOSÉE, ET PAR PAGE.
          #
          # `require-decided: "true"` ne portait que sur la grille DU RUN, et les deux questions
          # se séparent exactement là où ça compte : un critère non conforme quelque part est
          # TRANCHÉ pour le run, et sur les pages où le défaut n'apparaît pas il peut n'être le
          # verdict de personne. Mesuré sur ce dépôt : 104/106 décidés pour le run, et 8 à 11
          # ouverts sur CHACUNE des 37 pages — une porte verte au-dessus d'un livrable rempli à
          # 90 %.
          #
          # `pages` tient chaque grille de page à la même barre, qui est celle sur laquelle un
          # bilan page par page se juge réellement. Elle est atteignable depuis que le moteur
          # décide par page ce qu'il a MESURÉ par page (`scope.pageCoverage`) : sur l'audit réel
          # de cette PR, les 9 « à évaluer » de la page d'accueil tombent à 2 — 11.9 et 12.3, les
          # deux que l'adjudicateur a explicitement déclarés indécidables.
          #
          # Ce que ça change pour la PR : ce job peut maintenant rougir. C'est voulu, et c'est la
          # seule chose qui rende le zéro tenable — sans porte, « à évaluer » redevient une
          # colonne qu'on apprend à ignorer. Les deux issues sont ouvertes et nommées : faire
          # trancher 11.9 et 12.3 par l'adjudication, ou les déclarer dans `undecidable.json`
          # avec leur motif. Jamais un seuil.
          require-decided: pages
          undecidable-file: .ultra11y/undecidable.json
          # LA COUVERTURE, elle, bloque — et c'est la seule chose qui bloque ici.
          #
          # `require-decided` porte sur les CRITÈRES ; celle-ci porte sur les PAGES, et c'est
          # une question différente, un cran en amont : le balayage a-t-il seulement regardé
          # les 24 pages que `.ultra11yrc.json` déclare ? Mesuré sur le run 32135566667 : une
          # sonde suspendue a tué deux specs, le groupe série en a emporté quinze autres, et le
          # rapport RGAA est sorti avec 20 pages sur 35 — vert, sans nommer une seule des
          # manquantes. Un rapport plus court se lit exactement comme un rapport complet.
          #
          # Elle se combine avec le `continue-on-error` du balayage plus haut, elle ne le
          # contredit pas : un écran qui coince ne doit pas coûter le rapport des 23 autres,
          # mais il doit coûter le vert. La step garde donc son masque, et la perte devient
          # visible ici, nommément.
          require-sample: "true"
          # LE SEUL COMMENTAIRE DE LA PR, et c'est le bilan page par page.
          #
          # Il y en avait deux : le digest de la gate code et cette grille. Deux documents sur
          # un même run, qui ne s'accordaient même pas sur le taux, et un lecteur qui devait
          # choisir. La gate ne commente plus (voir son bloc plus haut), donc ce document doit
          # se suffire — et il le fait depuis l'amont : les constats qu'aucune page ne peut
          # revendiquer (code partagé, fichier hors routes) y ont maintenant leur propre bloc,
          # avec fichier, ligne et description, au lieu d'être seulement comptés en une phrase.
          #
          # Ce qu'il porte : une ligne par page avec sa base, ses C, ses NC et ses sévérités ;
          # la grille complète repliée ; puis un bloc par page en échec, ses non-conformités
          # séparées en BLOQUANTES et NON BLOQUANTES. Plus de colonne « À évaluer » : un nombre
          # dans une colonne est ce qu'un lecteur apprend à sauter (mesuré : chaque ligne
          # affichait 9 pendant des semaines). Ce qui reste ouvert est NOMMÉ, dans un bloc qui
          # disparaît entièrement quand la grille est complète — et `require-decided: pages`
          # ci-dessus fait rougir tant qu'il ne l'est pas.
          comment: "true"
          comment-kind: pages
          artifact-name: ultra11y-part-rgaa
          # Le commentaire doit envoyer son lecteur vers le livrable qui SURVIT au run : la
          # partie ci-dessus est supprimée par `a11y-bundle` au moment de la fusion.
          report-artifact: ultra11y-rgaa
      # LE REGISTRE RAFRAÎCHI VOYAGE DÉJÀ DANS LE LIVRABLE. L'Action le recopie elle-même
      # à côté du rapport (`audits/verdicts-rgaa.json`) dès que `ledger:` est câblé, donc
      # l'uploader une seconde fois sous son propre nom ne faisait qu'ajouter une partie de
      # plus à fusionner — exactement ce que « un seul livrable » cherche à supprimer.
      # Il reste à relire puis committer : un verdict est une affirmation sur ce dépôt, elle
      # se relit en revue comme le reste.
      # Sans ça, un échec est aussi un échec non diagnosticable — `e2e.yaml` remonte les mêmes.
      - name: Upload du rapport Playwright a11y
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultra11y-part-playwright
          path: |
            packages/app/playwright-report/a11y/
            packages/app/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop services
        if: always()
        run: docker compose down

  # UN SEUL LIVRABLE PAR RUN — et, depuis ce changement, un seul RAPPORT dedans.
  #
  # Trois jobs produisaient cinq artefacts — l'audit du code, le rapport page par page, le
  # registre de verdicts, le rapport Playwright, le rapport hebdomadaire — et un lecteur qui
  # veut « le rapport d'accessibilité de ce run » devait deviner lequel télécharger, puis en
  # ouvrir plusieurs pour recoller les morceaux. La fusion réglait le nombre d'artefacts et
  # pas le problème : le ZIP contenait toujours DEUX arborescences de rapport complètes, qui
  # ne s'accordaient pas sur le taux.
  #
  # Il n'en reste qu'un producteur de rapport (`a11y-pages`) ; ce job fusionne sa partie avec
  # le rapport Playwright, gardé à part parce que c'est du DIAGNOSTIC de suite de tests et non
  # un livrable d'accessibilité — quand un écran coince, c'est là qu'on va voir pourquoi.
  #
  # `delete-merged: true` : les parties disparaissent, il ne reste que `ultra11y-rgaa`.
  # `separate-directories: true` : chaque partie garde son répertoire, sans quoi une fusion à
  # plat en détruit une (mesuré : le livrable est tombé de 4,4 Mo à 384 Ko).
  #
  # `if: always()` : un tier qui échoue ne doit pas emporter le livrable de l'autre.
  # `actions/upload-artifact/merge` ne trouvant AUCUNE partie échoue par défaut — d'où
  # `continue-on-error`, parce qu'un run sans artefact est un fait, pas une panne : c'est le
  # cas d'un `push` sur alpha, où seule la gate tourne, et où elle ne produit plus rien.
  a11y-bundle:
    name: "RGAA · livrable unique"
    needs: [a11y-gate, a11y-pages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fusionner les parties en un seul artefact
        continue-on-error: true
        uses: actions/upload-artifact/merge@v4
        with:
          name: ultra11y-rgaa
          pattern: ultra11y-part-*
          separate-directories: true
          delete-merged: true
          retention-days: 30
