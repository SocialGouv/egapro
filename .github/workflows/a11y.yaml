name: "♿ Accessibilité (RGAA)"

# Audit d'accessibilité RGAA 4.1.2 / WCAG 2.2 AA. Pourquoi ce câblage, ce qu'il coûte et les
# décisions déjà prises → docs/accessibilite-ultra11y.md.
#
# L'Action `SocialGouv/ultra11y` n'existe plus (ultra11y 6.0.0) : l'audit complet passe par le
# bot `rgaa-audit` (Acci) d'iterion (#4899), et la revue de chaque PR par le skill `review-a11y`
# (a11y-review.yaml). Quatre jobs ici :
#
#   a11y-gate    CODE     — PR. Audit statique JSX/TSX de tout `src` par la devDependency, la
#                           même commande que le pre-commit et `pnpm verify`. Gratuit, aucun
#                           navigateur, aucun modèle, BLOQUANT (`--fail-on blocking`).
#   a11y-pages   RENDU    — cron, manuel. La suite Playwright `src/e2e/a11y/` capture les pages
#                           en épinglant l'état que chaque écran de tunnel exige, puis le moteur
#                           de la devDependency les audite, rejoue le registre de verdicts et
#                           rend le rapport page par page. AUCUN MODÈLE. Rouge sur une panne ou
#                           un balayage amputé (`check --require-sample`), jamais sur un constat.
#   rgaa-audit   JUGEMENT — cron, manuel. Le bot iterion : audit statique au moteur qu'il épingle,
#                           rejeu du registre, adjudication par des agents en lecture seule des
#                           critères qu'aucun moteur ne tranche, second lecteur, rapport daté.
#   a11y-bundle  LIVRABLE — fusionne les parties en un seul artefact `ultra11y-rgaa`.
#
# Le bot tourne `rendered=off`, et c'est structurel : son nœud `static_audit` purge
# `.ultra11y/pages/` avant d'auditer, et son balayage (`scan --sample`) visite des URL sous un
# état unique, sans ProConnect ni la machine à états du tunnel — il n'atteindrait pas les écrans
# de déclaration. Le rendu reste donc à `a11y-pages`, qui seul sait les ouvrir.
#
# Le rendu des seules pages qu'une PR touche est gardé par a11y-review.yaml (`review-a11y` :
# `affected` + `scan --since --baseline` sur la préversion de la PR).

on:
  pull_request:
  # LE RUN COMPLET, UNE FOIS PAR SEMAINE, sur alpha (branche par défaut) : lundi 04:00 UTC. Un
  # run qui adjuge se paie en modèle : une fois par semaine suffit à dater un livrable et à
  # rattraper une régression.
  schedule:
    - cron: "0 4 * * 1"
  # Le même run, à la demande : `gh workflow run a11y.yaml --ref alpha`.
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  # Une PR qui repousse annule son run précédent. Un run complet est un livrable PAYÉ : deux
  # lancements coup sur coup ne s'annulent pas.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Pas de `contents: write` : le registre de verdicts sort dans l'artefact, et c'est un humain
  # qui le commite après en avoir relu le diff. Pas de board non plus : `post_to_board` reste
  # à son défaut `false`, le bot n'ouvre aucune issue.

jobs:
  a11y-gate:
    name: "RGAA · audit statique du code"
    # Le run complet réaudite déjà tout `src` (a11y-pages et rgaa-audit).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Tout `src`, pas le diff : une gate qui ne regarde que les fichiers touchés ne voit pas la
      # régression qu'un changement provoque ailleurs. `src` et non un glob : le moteur fait son
      # propre globbing.
      - name: ultra11y — audit RGAA statique
        working-directory: packages/app
        run: pnpm exec ultra11y audit src --jsx --graph --standard rgaa --lang fr --fail-on blocking
      # Le commentaire de la revue de PR (a11y-review.yaml) lit la table RGAA de la devDependency :
      # le test tourne ici, là où elle est installée.
      - name: Test du commentaire de revue review-a11y
        run: node --test scripts/a11y/review-comment.test.mjs

  a11y-pages:
    name: "RGAA · rendu page par page (moteur seul)"
    # JAMAIS SUR UNE PR : stack docker complète et balayage navigateur, 30 à 40 minutes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    # ~20 min d'infrastructure, ~10 min de balayage, quelques minutes de moteur. Large exprès : un
    # job coupé sur timeout emporte le rapport ET l'artefact.
    timeout-minutes: 90
    # La stack (variables, dépendances, navigateur, services, build, base) est préparée par
    # l'action locale `.github/actions/a11y-stack`. ProConnect et Weez ne sont exposés qu'au build
    # et au balayage, les deux seules steps qui font tourner l'app.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Préparer la stack (deps, navigateur, services, build, base)
        uses: ./.github/actions/a11y-stack
        with:
          proconnect-client-id: ${{ secrets.EGAPRO_PROCONNECT_CLIENT_ID }}
          proconnect-client-secret: ${{ secrets.EGAPRO_PROCONNECT_CLIENT_SECRET }}
          proconnect-issuer: ${{ secrets.EGAPRO_PROCONNECT_ISSUER }}
          weez-api-url: ${{ secrets.EGAPRO_WEEZ_API_URL }}
      # Le balayage est piloté par PLAYWRIGHT, pas par `scan --sample` : chaque écran du tunnel
      # n'est ouvert que depuis un état de déclaration précis, que la suite épingle avant de
      # capturer. `continue-on-error` sur CETTE step seulement : un écran qui coince ne doit pas
      # coûter le rapport des autres. Il coûte le vert, à la step `require-sample`.
      - name: ultra11y — balayage RGAA des pages (Playwright)
        continue-on-error: true
        timeout-minutes: 25
        env:
          EGAPRO_PROCONNECT_CLIENT_ID: ${{ secrets.EGAPRO_PROCONNECT_CLIENT_ID }}
          EGAPRO_PROCONNECT_CLIENT_SECRET: ${{ secrets.EGAPRO_PROCONNECT_CLIENT_SECRET }}
          EGAPRO_PROCONNECT_ISSUER: ${{ secrets.EGAPRO_PROCONNECT_ISSUER }}
          EGAPRO_WEEZ_API_URL: ${{ secrets.EGAPRO_WEEZ_API_URL }}
        run: pnpm --filter app test:e2e:a11y
      # Le moteur de la devDependency, celui qui a ÉCRIT les instantanés : un seul format. `audit`
      # réingère `.ultra11y/pages/` tout seul. Il sort 1 sur un constat bloquant, ce qui n'est pas
      # une panne ici — on mesure ; tout autre code en est une.
      - name: ultra11y — audit du code et des pages capturées
        working-directory: packages/app
        run: |
          set -uo pipefail
          rc=0
          pnpm exec ultra11y audit src --jsx --graph --standard rgaa --lang fr --out audits --json > /dev/null || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::ultra11y audit : sortie $rc"
            exit "$rc"
          fi
          test -s audits/audit-latest.json
      # Le registre est REJOUÉ, sans modèle : chaque entrée repasse par la porte sur l'évidence du
      # jour, une entrée dont l'évidence a bougé est abandonnée comme périmée en le disant. Ce
      # qu'il ne rejoue pas reste « à évaluer » ici ; c'est `rgaa-audit` qui l'adjuge.
      - name: ultra11y — rejeu du registre de verdicts
        working-directory: packages/app
        run: |
          if ! pnpm exec ultra11y verify --apply .ultra11y/verdicts/rgaa.json \
            --in audits/audit-latest.json --out audits --standard rgaa --lang fr; then
            echo "::warning::ultra11y : le rejeu du registre a échoué — le rapport reste celui du moteur seul."
          fi
      - name: ultra11y — rapport page par page et rapport RGAA
        working-directory: packages/app
        run: |
          set -euo pipefail
          if ! pnpm exec ultra11y pages --in audits/audit-latest.json --format report \
            --out audits --evidence --html --standard rgaa --lang fr > /dev/null; then
            echo "::warning::ultra11y : aucune page dans le périmètre — pas de rapport page par page."
          fi
          path=$(pnpm --silent exec ultra11y report --in audits/audit-latest.json --evidence \
            --standard rgaa --lang fr --out audits)
          # La porte d'intégrité : aucun critère inventé, aucun NA injustifié, des calculs cohérents.
          pnpm exec ultra11y check --report "$path" --standard rgaa --quiet
          pnpm exec ultra11y report --in audits/audit-latest.json --html --evidence \
            --standard rgaa --lang fr --out audits > /dev/null ||
            echo "::warning::ultra11y : le rapport HTML n'a pas pu être rendu en entier."
      # LA COUVERTURE BLOQUE, et c'est la seule chose qui bloque ici : les pages que
      # `.ultra11yrc.json` déclare ont-elles toutes été capturées ? Un rapport amputé se lit
      # exactement comme un rapport complet.
      - name: ultra11y — chaque page déclarée a été capturée
        if: always()
        working-directory: packages/app
        run: pnpm exec ultra11y check --require-sample --standard rgaa --lang fr
      - name: Upload du rapport RGAA page par page
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ultra11y-part-pages
          path: packages/app/audits/
          retention-days: 7
          if-no-files-found: ignore
      # Du DIAGNOSTIC, pas un livrable : quand un écran coince, c'est là qu'on va voir pourquoi.
      - name: Upload du rapport Playwright a11y
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ultra11y-part-playwright
          path: |
            packages/app/playwright-report/a11y/
            packages/app/test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop services
        if: always()
        run: docker compose down

  rgaa-audit:
    name: "RGAA · audit et adjudication (iterion rgaa-audit)"
    # JAMAIS SUR UNE PR : c'est la moitié payée en modèle.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Un premier run sans registre adjuge toute la grille ; large exprès, un job coupé emporte
    # le rapport.
    timeout-minutes: 240
    env:
      # La release d'iterion ET la version du bot, installé depuis le même tag : le pin du moteur
      # (`bots/rgaa-audit/ultra11y.pin`, version + sha256) voyage avec lui. v7.38.1 épingle
      # encore le moteur 7.2.0 ; à monter sur la release qui contiendra SocialGouv/iterion#3708
      # (pin 9.6.5, la version de la devDependency).
      ITERION_VERSION: v7.38.1
      CLAUDE_CODE_VERSION: 2.1.332
      # Le credential du backend `claude_code` des agents. Lu depuis l'environnement, jamais
      # passé en argument.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node avec npm : le nœud `prepare` installe lui-même le moteur épinglé (`npm install`
      # dans le répertoire du run, empreinte vérifiée).
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - name: Installer iterion et le CLI Claude
        run: |
          set -euo pipefail
          # install.sh retombe sur `sudo mv` quand le répertoire n'existe pas.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://socialgouv.github.io/iterion/install.sh |
            INSTALL_DIR="$HOME/.local/bin" sh -s -- "$ITERION_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: Installer le bot rgaa-audit
        run: iterion bots install https://github.com/SocialGouv/iterion --path bots/rgaa-audit --ref "$ITERION_VERSION"
      # Le périmètre est le package app : `workspace_dir` y pointe, donc `scope_globs`, le
      # registre (`.ultra11y/verdicts/rgaa.json`, défaut du bot) et `.ultra11yrc.json` se
      # résolvent depuis `packages/app`, là où ils vivent. `undecidable_path` nomme le fichier du
      # dépôt (13.3, 13.4 : un classeur xlsx qu'aucun instrument ne peut ouvrir).
      #
      # Rapport consultatif : le bot n'échoue que sur un refus typé (moteur introuvable ou dont
      # l'empreinte diffère, périmètre vide, registre illisible, intégrité du rapport…), jamais
      # sur un constat. `--max-cost-usd` borne la dépense ; `--max-tokens` est le vrai mur d'un
      # run complet (le défaut de 3M s'épuise sur ~100 critères).
      - name: iterion rgaa-audit
        run: |
          iterion run .botz/rgaa-audit --sandbox none --no-interactive \
            --max-cost-usd 60 --max-tokens 5000000 \
            --var workspace_dir="$GITHUB_WORKSPACE/packages/app" \
            --var 'scope_globs=src/**' \
            --var rendered=off \
            --var undecidable_path=.ultra11y/undecidable.json \
            --var html_report=true \
            --var report_dir="$GITHUB_WORKSPACE/rgaa-report"
      - name: Upload du rapport rgaa-audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ultra11y-part-rgaa-audit
          path: rgaa-report/
          retention-days: 7
          if-no-files-found: ignore

  # UN SEUL LIVRABLE PAR RUN. `separate-directories: true` : chaque partie garde son répertoire,
  # sans quoi une fusion à plat en détruit une. `if: always()` : un tier qui échoue ne doit pas
  # emporter le livrable de l'autre ; une fusion sans aucune partie échoue, d'où
  # `continue-on-error`.
  a11y-bundle:
    name: "RGAA · livrable unique"
    needs: [a11y-pages, rgaa-audit]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Fusionner les parties en un seul artefact
        continue-on-error: true
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ultra11y-rgaa
          pattern: ultra11y-part-*
          separate-directories: true
          delete-merged: true
          retention-days: 30
