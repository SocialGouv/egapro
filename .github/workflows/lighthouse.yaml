name: 🔦 Lighthouse

on:
  deployment_status:

concurrency:
  group: lighthouse-${{ github.event.deployment.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: "Lighthouse audit"
    if: >
      github.event.deployment_status.state == 'success' &&
      !startsWith(github.event.deployment.environment, 'build-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Fallback only: this derives the subdomain from the deployment ref, which
      # is wrong for a deployment whose environment is not named after its ref
      # (a promoted test env is deployed from `alpha`). Kept for the deployments
      # that declare no environment URL.
      - name: Load SocialGouv variables
        id: env
        uses: socialgouv/kontinuous/.github/actions/env@1198b39082008127fd639ddc1700eb9315bb8ff3 # v1.188.0
      - name: Run Lighthouse CI
        run: pnpm test:lighthouse
        continue-on-error: true
        id: lighthouse
        env:
          LIGHTHOUSE_URL: ${{ github.event.deployment_status.environment_url || format('https://{0}.ovh.fabrique.social.gouv.fr', steps.env.outputs.subdomain) }}
      - name: Show Lighthouse scores
        if: always()
        working-directory: packages/app
        run: |
          echo "=== Lighthouse scores ==="
          find .lighthouseci -name "*.report.json" 2>/dev/null | while read f; do
            echo "Report: $f"
            node -e "
              const r = require(require('path').resolve(process.argv[1]));
              const c = r.categories;
              Object.entries(c).forEach(([k, v]) => {
                const score = Math.round(v.score * 100);
                const icon = score >= 90 ? 'OK' : score >= 50 ? 'WARN' : 'FAIL';
                console.log('[' + icon + '] ' + k + ': ' + score + '/100');
              });
            " "$f"
            echo ""
          done || echo "No report files found"
          echo "=== Files in .lighthouseci ==="
          ls -lh .lighthouseci/ 2>/dev/null || echo "Directory empty or missing"
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lighthouse-report
          path: packages/app/.lighthouseci/
          retention-days: 7
      - name: Fail if Lighthouse asserted errors
        if: steps.lighthouse.outcome == 'failure'
        run: exit 1
