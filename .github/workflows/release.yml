name: 🔖 Release

on:
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC token generation

env:
  GIT_AUTHOR_EMAIL: ${{ secrets.SOCIALGROOVYBOT_EMAIL }}
  GIT_AUTHOR_NAME: ${{ secrets.SOCIALGROOVYBOT_NAME }}
  GIT_COMMITTER_EMAIL: ${{ secrets.SOCIALGROOVYBOT_EMAIL }}
  GIT_COMMITTER_NAME: ${{ secrets.SOCIALGROOVYBOT_NAME }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Get GitHub App Token
      id: token
      uses: SocialGouv/token-bureau@453f0eeb5add59489df124a0aedcb20a9b7fb027 # v0.0.10
      with:
        token-bureau-url: https://token-bureau.fabrique.social.gouv.fr
        audience: socialgouv

    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: '.nvmrc'

    - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      with:
        run_install: false

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Import GPG key
      uses: crazy-max/ghaction-import-gpg@d6f3f49f3345e29369fe57596a3ca8f94c4d2ca7 # v5.4.0
      with:
        gpg_private_key: ${{ secrets.SOCIALGROOVYBOT_GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.SOCIALGROOVYBOT_GPG_PASSPHRASE }}
        git_user_signingkey: true
        git_commit_gpgsign: true
        git_push_gpgsign: false
        git_tag_gpgsign: true

    - name: Semantic Release
      env:
        GITHUB_TOKEN: ${{ steps.token.outputs.token }}
      run: |
        export PATH="$(pwd)/.github/bin/:$PATH"
        pnpm semantic-release
