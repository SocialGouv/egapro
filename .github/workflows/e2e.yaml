name: 🧪 E2E Tests

on:
  pull_request:
    branches:
      - alpha
  workflow_dispatch:

# Five shards run the PR's own code (pnpm install, build, tests) with whatever
# token `checkout` leaves in the git config. `merge` needs to write PR comments
# and keeps its own broader block; every other job only ever reads.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: "e2e ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.total }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      # A red shard must not cancel its siblings: their results are what makes the
      # failure diagnosable, and a cancelled shard is indistinguishable from a
      # shard that never ran.
      fail-fast: false
      matrix:
        include:
          - suite: suite
            script: test:e2e
            shard: 1
            total: 2
          - suite: suite
            script: test:e2e
            shard: 2
            total: 2
          - suite: grille
            script: test:e2e:grille
            shard: 1
            total: 3
          - suite: grille
            script: test:e2e:grille
            shard: 2
            total: 3
          - suite: grille
            script: test:e2e:grille
            shard: 3
            total: 3
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5438/egapro
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:3000/api/auth
      EGAPRO_PROCONNECT_CLIENT_ID: ${{ secrets.EGAPRO_PROCONNECT_CLIENT_ID }}
      EGAPRO_PROCONNECT_CLIENT_SECRET: ${{ secrets.EGAPRO_PROCONNECT_CLIENT_SECRET }}
      EGAPRO_PROCONNECT_ISSUER: ${{ secrets.EGAPRO_PROCONNECT_ISSUER }}
      EGAPRO_WEEZ_API_URL: ${{ secrets.EGAPRO_WEEZ_API_URL }}
      EGAPRO_SUIT_API_URL: ${{ secrets.EGAPRO_SUIT_API_URL }}
      EGAPRO_GATEWAY_SHARED_SECRET: dev-gateway-shared-secret-minimum-32-chars
      # Test-only campaign-clock seam (#4022). compliance.e2e.ts and
      # declaration.e2e.ts pin campaign years through withCampaignYear so the
      # indicator-G branches stay exercised whatever the calendar says; without
      # this flag /api/e2e-clock 404s by design and those specs fail. The route
      # stays unreachable in production, which is gated by NODE_ENV on top of
      # this flag, and the flag is set in no .kontinuous env config.
      EGAPRO_E2E_CLOCK: "true"
      # Test-only admin two-factor seam (#4467). Since #4461 /admin demands an
      # `eidas1-mfa` sign-in, and the FIA1V2 test identity has no second factor
      # a headless run can present, so without this flag every backoffice spec
      # lands on the resume screen. The seam additionally demands a loopback
      # host and is declared in no .kontinuous env config — asserted by
      # src/server/auth/__tests__/e2eFlagsAbsentFromDeployConfig.test.ts.
      EGAPRO_E2E_ADMIN_MFA: "true"
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: egapro-dev-app
      CLAMAV_HOST: localhost
      CLAMAV_PORT: 3310
      ADMIN_EMAILS: test@fia1.fr
      NOTIFICATIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5439/egapro_notifications
      MAIL_ENABLED: "true"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      MAIL_FROM: no-reply@egapro.local
      MAILDEV_URL: http://localhost:1080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # This job only ever reads its own checkout; no step pushes or pulls.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Runs before the browser, the docker stack and the Next build: `--list` neither
      # starts the web server nor runs globalSetup, so an unbalanced shard graph is
      # caught in a minute instead of after a full provisioning.
      - name: Guard against an empty shard
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/shard-list.json
        run: |
          set -euo pipefail
          # Collecting the tests loads them, and loading them resolves the workspace
          # packages they import. `test:e2e` builds them through its `pretest` hook;
          # `test:e2e:grille` has no such hook, so the build is made explicit here for
          # both rather than left to differ between two shards of the same gate.
          pnpm --filter notifications build
          # Playwright disables its own "no tests found" error as soon as --shard is
          # set, so a shard that collects nothing exits 0 and the gate reads green
          # while a whole slice of the suite never ran. That is not hypothetical: a
          # dependency between top-level projects, or a file-level serial group, makes
          # Playwright hand every test to shard 1 and leave the others empty.
          # The `setup` project is replayed inside every shard as a dependency, so it
          # is never evidence that the shard has work of its own — hence excluded.
          pnpm --filter app ${{ matrix.script }} --list --reporter=json --shard=${{ matrix.shard }}/${{ matrix.total }}
          COUNT=$(jq '[.. | objects | select(has("projectName")) | select(.projectName != "setup")] | length' "$PLAYWRIGHT_JSON_OUTPUT_FILE")
          echo "- \`${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.total }}\` : **$COUNT** tests collectés (hors \`setup\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::le shard ${{ matrix.shard }}/${{ matrix.total }} de « ${{ matrix.suite }} » ne collecte aucun test"
            exit 1
          fi
      - name: Install Chromium manually (bypass Playwright extractor)
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Ces deux constantes sont DICTÉES par la version de @playwright/test, elles ne se
          # choisissent pas : Playwright cherche le navigateur dans
          # ~/.cache/ms-playwright/chromium-<revision>, et refuse de démarrer si le dossier porte
          # une autre révision. Un bump de @playwright/test sans bump ici donne
          # « browserType.launch: Executable doesn't exist at .../chromium_headless_shell-<rev> »
          # (mesuré sur la PR #4408, 1.59.1 -> 1.62.1 : le cache restait sur 1217).
          # Les valeurs se lisent dans playwright-core/browsers.json de la version installée :
          #   jq '.browsers[] | select(.name=="chromium")' node_modules/playwright-core/browsers.json
          # -> revision = CHROMIUM_VERSION, browserVersion = CFT_BUILD.
          # Les TROIS workflows (e2e, a11y, e2e-grille) partagent ce bloc et ce cache : les
          # désaligner, c'est laisser rouge celui qu'on n'a pas corrigé.
          CHROMIUM_VERSION=1234
          CFT_BUILD=151.0.7922.34

          install_browser() {
            local zip_name="$1" dest_subdir="$2" extracted_dir="$3" final_dir="$4"
            local dest="$HOME/.cache/ms-playwright/${dest_subdir}"
            mkdir -p "$dest"
            echo "::group::Download ${zip_name}"
            time curl --fail --location --silent --show-error \
              --max-time 120 \
              --retry 5 --retry-delay 3 --retry-all-errors \
              -o "/tmp/${zip_name}" \
              "https://cdn.playwright.dev/builds/cft/${CFT_BUILD}/linux64/${zip_name}"
            ls -lh "/tmp/${zip_name}"
            echo "::endgroup::"
            echo "::group::Extract ${zip_name} with system unzip"
            time unzip -q "/tmp/${zip_name}" -d "$dest"
            if [ "$extracted_dir" != "$final_dir" ]; then
              mv "$dest/$extracted_dir" "$dest/$final_dir"
            fi
            touch "$dest/INSTALLATION_COMPLETE"
            rm "/tmp/${zip_name}"
            ls -la "$dest" | head -5
            echo "::endgroup::"
          }

          install_browser \
            "chrome-linux64.zip" \
            "chromium-${CHROMIUM_VERSION}" \
            "chrome-linux64" \
            "chrome-linux"

          install_browser \
            "chrome-headless-shell-linux64.zip" \
            "chromium_headless_shell-${CHROMIUM_VERSION}" \
            "chrome-headless-shell-linux64" \
            "chrome-headless-shell-linux64"
      # Même retry que dans a11y.yaml, et pour la même raison : `install-deps` est un
      # `apt-get install`, et une tentative unique sous 5 minutes est un tirage au sort quand le
      # miroir est lent (mesuré : le job a11y a expiré à 5:00 pile sur un commit où celui-ci
      # passait). Les deux workflows partagent volontairement ce bloc d'infrastructure — les
      # désaligner, c'est laisser le flake dans celui qu'on n'a pas corrigé.
      - name: Install Playwright system dependencies
        timeout-minutes: 14
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail
          # APT SUR LE MIROIR AZURE EST CE QUI PEND — trois mesures pour en arriver là.
          #
          #  1. run 32290208703 : trois tentatives en CINQ SECONDES sur `dpkg/lock-frontend`.
          #     La boucle de retry ne dormait pas : elle relançait le même tirage.
          #  2. run 32296197686 : avec une attente, l'étape patiente quatre minutes puis meurt
          #     sur un TROISIÈME verrou, `/var/lib/apt/lists/lock`, non surveillé.
          #  3. run 32296977647 : avec `DPkg::Lock::Timeout`, la tentative 1 tourne SEPT MINUTES
          #     sans rendre la main (le timeout fonctionne, apt attend) avant d'être coupée, et
          #     la tentative 2 échoue en cinq secondes sur ce même verrou de `lists` — que
          #     `DPkg::Lock::Timeout` ne couvre pas. Le processus 2077 le tenait depuis plus de
          #     dix minutes : un `apt-get update` de fond bloqué sur le miroir Azure.
          #
          # C'est le même diagnostic que SocialGouv/ultra11y@7090f62 (« apt on the Azure mirror is
          # what hangs »), et la même conclusion : on ne fait pas dépendre un livrable d'apt.
          #
          # Deux lignes de défense. D'abord on libère le verrou pour de bon — c'est une VM
          # jetable, le processus qu'on tue est un updater de fond dont ce job n'a aucun besoin.
          # Ensuite, si `install-deps` échoue quand même, on CONTINUE : l'image ubuntu-22.04
          # embarque Chrome et donc les bibliothèques partagées que Playwright réclame, et la
          # vraie preuve n'est pas ce qu'apt a répondu — c'est que le navigateur démarre, ce que
          # les étapes suivantes vérifient immédiatement. Un miroir injoignable ne doit pas se
          # présenter comme un échec de tests.
          echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99-ultra11y-lock-timeout > /dev/null
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo pkill -9 -f 'apt-get|apt\.systemd\.daily|unattended-upgrade' 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend
          sudo dpkg --configure -a > /dev/null 2>&1 || true
          for attempt in 1 2; do
            if timeout 300 pnpm --filter app exec playwright install-deps chromium; then
              echo "playwright install-deps: ok (tentative $attempt)"
              exit 0
            fi
            echo "::warning::playwright install-deps a échoué ou expiré (tentative $attempt/2)"
            sudo apt-get clean || true
            sleep 20
          done
          echo "::warning::playwright install-deps n'a pas abouti (apt injoignable ou verrouillé). On continue : l'image du runner embarque déjà Chrome et ses bibliothèques partagées, et le lancement du navigateur, juste après, est la vraie vérification."
          exit 0
      - name: Start services
        run: docker compose up -d
      - name: Build
        run: pnpm build
      - name: Apply database schema
        run: pnpm db:push
      # The blob reporter is passed on the command line rather than written into
      # either config: playwright.grille.config.ts keeps producing the JSON report
      # that the nightly recette workflow turns into grille-recette.md, untouched.
      - name: Run E2E shard
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: ${{ github.workspace }}/blob-report/${{ matrix.suite }}-${{ matrix.shard }}.zip
        run: pnpm --filter app ${{ matrix.script }} --reporter=blob,github --shard=${{ matrix.shard }}/${{ matrix.total }}
      - name: Stop services
        if: always()
        run: docker compose down
      - name: Upload blob report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.suite }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces-${{ matrix.suite }}-${{ matrix.shard }}
          path: packages/app/test-results/
          retention-days: 7
          if-no-files-found: ignore

  merge:
    name: "e2e rapport fusionné"
    # A merged report is most useful precisely when a shard is red, hence not a
    # plain success-only condition — but `always()` would also run this job, and
    # rewrite the sticky PR comment to a stale "0 passé", on a run that
    # `cancel-in-progress` superseded before any shard finished. `!cancelled()`
    # keeps the report on a real failure without that overwrite on a run nobody
    # is waiting on any more.
    if: ${{ !cancelled() }}
    needs: shard
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: blob-report
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into a single HTML report
        run: |
          set -euo pipefail
          if ! ls blob-report/*.zip > /dev/null 2>&1; then
            echo "::warning::aucun rapport blob à fusionner (tous les shards ont échoué avant d'en produire un)"
            exit 0
          fi
          pnpm --filter app exec playwright merge-reports \
            -c playwright.merge.config.ts \
            "${{ github.workspace }}/blob-report"
          cp packages/app/merged-results.json packages/app/playwright-report/merged-results.json
      # Uploaded before the recette report is generated: the report links each
      # failure to this artifact, the merged HTML report that carries the traces.
      - name: Upload merged Playwright report
        id: upload-report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: packages/app/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Generate the recette report
        if: always()
        env:
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          pnpm --filter app report:grille \
            --results merged-results.json \
            --out playwright-report/grille-recette.md \
            --scope "tous les cas (185 coordonnées)" \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --report-url "$REPORT_URL"
      - name: Upload recette report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grille-recette
          path: packages/app/playwright-report/grille-recette.md
          retention-days: 7
          if-no-files-found: ignore
      # A job summary only shows on the run page, never on the pull request, so one
      # comment — edited in place on every run — carries the verdict and the link.
      # A fork's token cannot write to the base repository: skipped there.
      # Purely informational: a `gh api` hiccup here (rate limit, transient 5xx)
      # must not fail `merge` and turn the required check red on a run where
      # every shard passed.
      - name: Comment the recette report on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          report=packages/app/playwright-report/grille-recette.md
          marker="<!-- e2e-recette-grille -->"
          {
            echo "$marker"
            echo "### 🧪 Recette E2E — grille 185 coordonnées"
            echo ""
            if [ -f "$report" ]; then
              sed -n '/^| Date |/,/^$/p' "$report"
              grep '^### ❌ ' "$report" | sed 's/^### ❌ /- ❌ /' || true
              echo ""
            else
              echo "> ⚠️ Rapport de recette absent : voir les logs du run."
              echo ""
            fi
            echo "➡️ [Grille complète dans le résumé du run]($RUN_URL) · [Rapport Playwright et traces]($REPORT_URL)"
          } > "$RUNNER_TEMP/recette-comment.md"
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n 1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -F body=@"$RUNNER_TEMP/recette-comment.md" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@"$RUNNER_TEMP/recette-comment.md" > /dev/null
          fi

  e2e:
    # The required status check of `alpha`, and it has to be this shape. A matrix
    # job publishes contexts named "e2e suite 1/2", never "Test e2e", so branch
    # protection would wait forever on a context nobody emits. And `if: always()`
    # is load-bearing rather than defensive: a job skipped because one of its
    # `needs` failed is counted as PASSING by branch protection, so without it a
    # red shard would quietly let the pull request merge.
    name: "Test e2e"
    if: always()
    needs: [shard, merge]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every shard and the merge to have succeeded
        run: |
          set -euo pipefail
          shards='${{ needs.shard.result }}'
          merge='${{ needs.merge.result }}'
          echo "shards=$shards merge=$merge"
          status=0
          if [ "$shards" != "success" ]; then
            echo "::error::au moins un shard E2E n'est pas passé (résultat agrégé : $shards)"
            status=1
          fi
          if [ "$merge" != "success" ]; then
            echo "::error::la fusion des rapports n'est pas passée (résultat : $merge)"
            status=1
          fi
          exit "$status"
