name: 👀 Review
on:
  push:
    branches:
      - "dependabot/**"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.ref }}

jobs:
  build-app:
    permissions:
      contents: read
      id-token: write # OIDC identity for buildkit-operator /route auth
      pull-requests: read # resolve the PR number for the footer version link
    environment: build-review
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    runs-on: ubuntu-latest
    steps:
      - name: ⏬ Checkout code repository
        uses: actions/checkout@v4

      # Resolve the PR number from the commit SHA (review builds trigger on
      # `push`, so it is not in the event context). Empty if no PR is open yet;
      # the footer then falls back to a branch-scoped PR search link.
      - name: 🔍 Resolve pull request number
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                --jq '.[0].number // empty' 2>/dev/null || true)
          echo "number=$N" >> "$GITHUB_OUTPUT"

      - name: 📌 Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY_URL }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}/app
          tags: |
            type=sha,prefix=persist-,format=long,enable=${{
              github.ref_name == 'dev' ||
              github.ref_name == 'develop' ||
              github.ref_name == 'preprod' ||
              github.ref_name == 'main' ||
              github.ref_name == 'master'
            }},priority=840
            type=sha,prefix=sha-,format=long,priority=890
            type=ref,event=branch,priority=600

      - name: 🔑 Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 📦 Build and push Docker image for app
        uses: socialgouv/buildkit-operator@v1
        with:
          buildd-url: ${{ vars.BUILDKIT_OPERATOR_BUILDD_URL }}
          gateway-host: ${{ vars.BUILDKIT_OPERATOR_GATEWAY_HOST }}
          ca: ${{ secrets.BUILDKIT_OPERATOR_CA }}
          cert: ${{ secrets.BUILDKIT_OPERATOR_CERT }}
          key: ${{ secrets.BUILDKIT_OPERATOR_KEY }}
          context: "."
          file: "packages/app/Dockerfile"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_EGAPRO_ENV=dev
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_MATOMO_URL=${{ vars.NEXT_PUBLIC_MATOMO_URL }}
            NEXT_PUBLIC_MATOMO_SITE_ID=${{ vars.NEXT_PUBLIC_MATOMO_SITE_ID_DEV }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
            sentry_release=${{ github.ref_name }}
            app_version=${{ github.ref_name }}
            pr_number=${{ steps.pr.outputs.number }}
          push: true

  kontinuous:
    needs: [build-app]
    name: "Deploy on Kubernetes 🐳"
    uses: socialgouv/workflows/.github/workflows/use-ks-gh-review-atlas.yaml@v1
    secrets: inherit

