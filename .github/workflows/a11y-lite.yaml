name: "♿ Accessibilité du code touché (ultra11y)"

# LA GATE DU CODE QU'UNE PR TOUCHE, au moteur que le bot iterion `rgaa-audit` épingle.
# Pourquoi ce job, ce qu'il couvre et ce qu'il ne couvre pas → docs/accessibilite-ultra11y.md,
# « La gate du code touché sur chaque PR ».
#
# Il remplace le mode lite (capture des pages que le diff peut changer, rouge sur un constat de
# rendu NOUVEAU par rapport à une baseline) : ultra11y 7.0.0 a retiré `affected`, `audit --lite`,
# la baseline et le format d'annotations GitHub, et le bot iterion n'a pas de mode sans modèle.
# Ce qui reste, et qui ne coûte ni navigateur ni modèle : l'audit statique des fichiers que la
# PR change, rouge sur un constat bloquant.
#
# Une version d'ultra11y à part de la devDependency, et c'est voulu : `a11y-gate` (a11y.yaml)
# audite déjà tout `src` avec la devDependency, la même que le pre-commit. Ce job-ci lit le
# diff avec le moteur du run hebdomadaire, pour qu'une PR n'introduise pas ce que le livrable
# lui reprochera lundi.

on:
  pull_request:
    branches:
      - alpha

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  a11y-lite:
    name: "RGAA · code touché par la PR"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Version EXACTE : celle que `bots/rgaa-audit/ultra11y.pin` d'iterion épingle
      # (SocialGouv/iterion#3592). La monter avec le pin du bot, jamais seule.
      ULTRA11Y_VERSION: 7.2.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # la branche de base, pour `--since`
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
      # `--since` : les seuls fichiers que la PR change. Une PR qui ne touche aucun fichier
      # auditable audite zéro fichier et passe — c'est la bonne réponse, pas un trou.
      - name: ultra11y — audit RGAA du code touché
        working-directory: packages/app
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p audits
          npx -y "ultra11y@$ULTRA11Y_VERSION" audit --since "origin/$BASE_REF" \
            --jsx --graph --standard rgaa --lang fr --fail-on blocking --json > audits/diff.json
      # Le vert ne vaut que si le document existe et vient du moteur épinglé : un `npx` qui
      # aurait résolu une autre version auditerait avec d'autres règles sans le dire.
      - name: ultra11y — vérifier le document et résumer
        if: always()
        working-directory: packages/app
        run: |
          set -euo pipefail
          test -s audits/diff.json || { echo "::error::ultra11y : aucun document d'audit écrit."; exit 1; }
          node <<'EOF'
            const fs = require("fs");
            const doc = JSON.parse(fs.readFileSync("audits/diff.json", "utf8"));
            const want = process.env.ULTRA11Y_VERSION;
            if (doc.version !== want) {
              console.log(`::error::ultra11y : le document vient de la version ${doc.version}, attendu ${want}.`);
              process.exit(1);
            }
            const findings = doc.findings || [];
            const bySeverity = {};
            for (const f of findings) bySeverity[f.severity] = (bySeverity[f.severity] || 0) + 1;
            const counts = Object.entries(bySeverity).map(([s, n]) => `${n} ${s}`).join(", ") || "aucun";
            const line = `ultra11y ${doc.version} : ${doc.scope.files} fichier(s) touché(s) audité(s), constats : ${counts}.`;
            console.log(line);
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${line}\n`);
          EOF
      - name: Upload de l'audit du code touché
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ultra11y-pr-diff
          path: packages/app/audits/diff.json
          retention-days: 7
          if-no-files-found: ignore
