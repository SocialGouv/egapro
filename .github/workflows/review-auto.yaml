name: 👓 Review Auto
on:
  push:
    branches:
      - "**"
      - "!master"
      # Persistent test envs (rgaa-persist, perf-persist) are deployed only by
      # promote-test-env.yaml, which builds from a release tag — that is what
      # makes their footer link to the release changelog. A push here would
      # rebuild them with APP_VERSION=<branch> and break that. Same exclusion
      # convention as deactivate.yaml.
      - "!**-persist"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.ref }}

jobs:
  build-app:
    permissions:
      contents: read
      id-token: write # OIDC identity for buildkit-operator /route auth
      pull-requests: read # resolve the PR number for the footer version link
    environment: build-review-auto
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    runs-on: ubuntu-latest
    steps:
      - name: ⏬ Checkout code repository
        uses: actions/checkout@v4

      # The footer exposes a direct link to the PR on review apps. Review builds
      # trigger on `push` (not `pull_request`), so the PR number is not in the
      # event context — resolve it from the commit SHA. Empty on the first push
      # of a branch (PR not opened yet); the footer then falls back to a
      # branch-scoped PR search link.
      - name: 🔍 Resolve pull request number
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No PR yet is a normal state and must not fail the build, but an API
          # error must stay visible: without this, a bad token or a rate limit
          # is indistinguishable from "branch has no PR".
          if ERR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                     --jq '.[0].number // empty' 2>&1 >pr-number.txt); then
            N=$(cat pr-number.txt)
          else
            N=""
            echo "::warning::Numéro de PR non résolu (${ERR}) — le pied de page pointera vers une recherche par branche."
          fi
          echo "number=$N" >> "$GITHUB_OUTPUT"

      - name: 📌 Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY_URL }}/${{ vars.PROJECT_NAME }}/${{ github.event.repository.name }}/app
          tags: |
            type=sha,prefix=persist-,format=long,enable=${{
              github.ref_name == 'dev' ||
              github.ref_name == 'develop' ||
              github.ref_name == 'preprod' ||
              github.ref_name == 'main' ||
              github.ref_name == 'master'
            }},priority=840
            type=sha,prefix=sha-,format=long,priority=890
            type=ref,event=branch,priority=600

      - name: 🔑 Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 📦 Build and push Docker image for app
        uses: socialgouv/buildkit-operator@v1
        with:
          buildd-url: ${{ vars.BUILDKIT_OPERATOR_BUILDD_URL }}
          gateway-host: ${{ vars.BUILDKIT_OPERATOR_GATEWAY_HOST }}
          ca: ${{ secrets.BUILDKIT_OPERATOR_CA }}
          cert: ${{ secrets.BUILDKIT_OPERATOR_CERT }}
          key: ${{ secrets.BUILDKIT_OPERATOR_KEY }}
          context: "."
          file: "packages/app/Dockerfile"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_EGAPRO_ENV=dev
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_MATOMO_URL=${{ vars.NEXT_PUBLIC_MATOMO_URL }}
            NEXT_PUBLIC_MATOMO_SITE_ID=${{ vars.NEXT_PUBLIC_MATOMO_SITE_ID_DEV }}
            APP_VERSION=${{ github.ref_name }}
            SENTRY_RELEASE=${{ github.ref_name }}
            PR_NUMBER=${{ steps.pr.outputs.number }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          push: true

  kontinuous:
    needs: [build-app]
    name: "Deploy on Kubernetes 🐳"
    uses: socialgouv/workflows/.github/workflows/use-ks-gh-review-auto-atlas.yaml@v1
    secrets: inherit

