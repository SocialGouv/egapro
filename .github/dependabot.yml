version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    # Même cadence et même branche que l'écosystème npm ci-dessous. Les versions de la chaîne
    # a11y que Dependabot ne voit pas (`ITERION_VERSION` d'a11y.yaml) se montent à la main
    # → docs/accessibilite-ultra11y.md, « Bump de version ».
    target-branch: alpha
    labels:
      - bot
      - dependencies
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Europe/Paris
  - package-ecosystem: "npm"
    labels:
      - bot
      - dependencies
    target-branch: alpha
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Europe/Paris
    versioning-strategy: increase-if-necessary
    groups:
      # Pinned to the exact versions @react-pdf/renderer resolves: a partial bump would install two layout/pdfkit copies.
      react-pdf:
        patterns:
          - "@react-pdf/*"
    allow:
      - dependency-name: "*"
        dependency-type: direct
    ignore:
      - dependency-name: "@types/*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
  # Image de base de packages/app/Dockerfile, épinglée par tag exact + digest :
  # Dependabot remonte les deux ensemble. Les montées de majeure sont ignorées
  # pour rester sur la ligne LTS 24 (une majeure se décide, elle ne se subit pas).
  - package-ecosystem: docker
    directory: "/packages/app"
    target-branch: alpha
    labels:
      - bot
      - dependencies
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Europe/Paris
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
