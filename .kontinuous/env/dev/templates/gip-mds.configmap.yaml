# Source of the GIP-MDS file consumed by POST /api/gip-mds/import.
#
# Review apps stay on the in-image mock: the post-upgrade import Job
# (gip-mds-import-job.yaml) is a `helm.sh/hook`, so pointing this at SUIT before
# the mTLS certificate is sealed in `suit-client-cert` would fail the handshake,
# fail the Job, and fail the release on every deploy.
#
# To check SUIT connectivity without touching this: `pnpm --filter app suit:check`
# (runs from a pod too — it only reads env vars).
kind: ConfigMap
apiVersion: v1
metadata:
  name: gip-mds
data:
  EGAPRO_GIP_MDS_API_URL: "http://app/api/gip-mds/mock"
