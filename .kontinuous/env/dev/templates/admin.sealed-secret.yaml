# Admin allow-list for ProConnect sign-in.
#
# Single key:
#   ADMIN_EMAILS  comma-separated email list; promotes/demotes the admin
#                 role on each ProConnect sign-in.
#
# cluster-wide (review app namespaces are dynamic, one per branch). dev and
# preprod seal the exact same value — same cluster, same controller. Full
# rationale and the re-sealing procedure: docs/architecture.md §5.7.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: 'true'
  name: admin
spec:
  encryptedData:
    ADMIN_EMAILS: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: 'true'
      name: admin
    type: Opaque
