# Basic-auth credentials for the Mailpit web UI and API (#4695).
#
# Single key:
#   auth  htpasswd line (`user:bcrypt-hash`) mounted read-only into the
#         `mailpit` container and read through MP_UI_AUTH_FILE.
#
# Scope: cluster-wide, like the other dev/preprod sealed secrets. The encrypted
# value below is a placeholder: seal the real one with the commands in
# docs/mails.md before merging.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: 'true'
  name: mailpit-basic-auth
spec:
  encryptedData:
    auth: AgPLACEHOLDER_A_SCELLER
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: 'true'
      name: mailpit-basic-auth
    type: Opaque
