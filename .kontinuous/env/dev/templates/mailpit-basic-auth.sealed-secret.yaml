# Basic-auth credentials for the Mailpit web UI Ingress (#4695).
#
# Single key:
#   auth  htpasswd line (`user:hash`) read by ingress-nginx through the
#         `auth-secret` annotation of the `mailpit` Ingress.
#
# Scope: cluster-wide, like the other dev/preprod sealed secrets. The encrypted
# value below is a placeholder: seal the real one with the commands in
# docs/mails.md before merging.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: 'true'
  name: mailpit-basic-auth
spec:
  encryptedData:
    auth: AgPLACEHOLDER_A_SCELLER
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: 'true'
      name: mailpit-basic-auth
    type: Opaque
