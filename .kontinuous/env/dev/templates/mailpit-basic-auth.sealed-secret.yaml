# Basic-auth credentials for the Mailpit web UI and API (#4695).
#
# Keys, both injected into the `mailpit` container through secretKeyRef and
# combined into MP_UI_AUTH (`user:password`):
#   MAILPIT_USER      login, non-empty, no whitespace, no `:`
#   MAILPIT_PASSWORD  password, non-empty, no whitespace
#
# Scope: cluster-wide, like the other dev/preprod sealed secrets. Resealing
# procedure: docs/mails.md.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: 'true'
  name: mailpit-basic-auth
spec:
  encryptedData:
    MAILPIT_USER: 
    MAILPIT_PASSWORD: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: 'true'
      name: mailpit-basic-auth
    type: Opaque
