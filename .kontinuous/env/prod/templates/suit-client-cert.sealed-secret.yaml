# Client certificate presented to the SUIT API (mTLS) — issue #3911.
#
# Two keys to seal into this secret:
#   EGAPRO_SUIT_CLIENT_CERT_P12_BASE64  the .p12 bundle, base64 on a single line
#   EGAPRO_SUIT_CLIENT_CERT_PASSWORD    its passphrase
#
# Kept apart from the `suit` secret on purpose: that one is mounted with a
# non-optional secretRef, so a half-sealed state there would stop the app pod
# from starting. This one is wired `optional: true` in values.yaml, so an empty
# encryptedData is harmless — SUIT calls simply go out without a client
# certificate until the keys are sealed in.
#
# Production currently points at SUIT Validation like the other environments
# (EGAPRO_SUIT_API_URL in suit.configmap.yaml), so the validation certificate
# is what belongs here for now. When production is repointed at the production
# SUIT instance, this secret must be resealed with the production certificate —
# certificates are not interchangeable between SUIT instances.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  name: suit-client-cert
  namespace: egapro
spec:
  encryptedData: {}
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      name: suit-client-cert
    type: Opaque
