# Admin allow-list for ProConnect sign-in — issue #4588.
#
# Single key:
#   ADMIN_EMAILS  comma-separated email list; promotes/demotes the admin
#                 role on each ProConnect sign-in.
#
# namespace-wide, scoped to `egapro` — the production cluster has its own
# sealed-secrets controller and certificate. Full rationale and the
# re-sealing procedure: docs/architecture.md §5.7.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: 'true'
  name: admin
  namespace: egapro
spec:
  encryptedData:
    ADMIN_EMAILS: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: 'true'
      name: admin
    type: Opaque
