apiVersion: batch/v1
kind: CronJob
metadata:
  name: user-cleanup-daily
  namespace: {{ .Values.global.namespace }}
spec:
  schedule: "0 2 * * *" # Daily at 02:00 UTC — offset from declaration-cleanup (03:00) and audit-cleanup (04:00)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Fail fast: a transient DB error is retried by the next daily run, and a
      # permanent one (schema drift) gains nothing from a retry loop.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: user-cleanup-daily
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          containers:
            - name: user-cleanup
              image: "{{ .Values.global.registry }}/{{ .Values.global.imageProject }}/{{ .Values.global.imageRepository }}/app:{{ .Values.global.imageTag }}"
              securityContext:
                allowPrivilegeEscalation: false
              env:
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Values.global.pgSecretName }}"
                      key: PGHOST
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Values.global.pgSecretName }}"
                      key: PGDATABASE
                - name: POSTGRES_PORT
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Values.global.pgSecretName }}"
                      key: PGPORT
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Values.global.pgSecretName }}"
                      key: PGUSER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Values.global.pgSecretName }}"
                      key: PGPASSWORD
                - name: POSTGRES_SSLMODE
                  valueFrom:
                    secretKeyRef:
                      name: "{{ .Values.global.pgSecretName }}"
                      key: PGSSLMODE
              # Optional override of the announced retention window. Unset
              # configmap = no-op: the script falls back to the domain constant.
              envFrom:
                - configMapRef:
                    name: "user-retention"
                    optional: true
              command:
                - node
                - packages/app/scripts/user-cleanup.bundle.mjs
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
