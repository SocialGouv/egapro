apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: files-restricted
  annotations:
    kubernetes.io/ingress.class: nginx
    # Basic auth is the only guard of these files for non-whitelisted IPs: cap the attempts per client
    # before they reach the pod (the files server also locks an IP out after repeated failures).
    nginx.ingress.kubernetes.io/limit-rpm: "30"
    # nginx.ingress.kubernetes.io/satisfy: "any"
    # nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.whitelist | join "," | quote }}
    # nginx.ingress.kubernetes.io/auth-type: basic
    # nginx.ingress.kubernetes.io/auth-secret: basic-auth
    # nginx.ingress.kubernetes.io/auth-realm: 'Identification'
spec:
  tls:
  - hosts:
      - {{ .Values.global.host }}
    secretName: api-crt
  rules:
  {{ range $fileName := .Values.files.restricted }}
  - host: {{ $.Values.global.host }}
    http:
      paths:
      - path: /{{ $fileName }}
        pathType: ImplementationSpecific
        backend:
          service:
            name: files
            port:
              number: 80

    {{ end }}
