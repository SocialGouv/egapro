{{- if .Values.global.companyLocationBackfillEnabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: company-location-backfill
  namespace: {{ .Values.global.namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: company-location-backfill
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: backfill
          image: "{{ .Values.global.registry }}/{{ .Values.global.imageProject }}/{{ .Values.global.imageRepository }}/app:{{ .Values.global.imageTag }}"
          securityContext:
            allowPrivilegeEscalation: false
          envFrom:
            - secretRef:
                name: "{{ .Values.global.pgSecretName }}"
            - secretRef:
                name: api
          command:
            - node
            - packages/app/scripts/backfill-company-location.bundle.mjs
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
{{- end }}
