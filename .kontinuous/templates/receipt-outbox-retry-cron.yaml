apiVersion: batch/v1
kind: CronJob
metadata:
  name: receipt-outbox-retry
  namespace: {{ .Values.global.namespace }}
spec:
  # Every 10 minutes: the outbox only holds rows whose request died, and the
  # replay window (5 min) means a row is never picked up while its own request
  # might still be finishing.
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: receipt-outbox-retry
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 100
            runAsNonRoot: true
          containers:
            - name: trigger
              image: curlimages/curl:8.12.1
              securityContext:
                allowPrivilegeEscalation: false
              command:
                - /bin/sh
                - -c
                - |
                  curl -X POST "http://app:3000/api/receipts/retry" \
                    --connect-timeout 10 \
                    --max-time 300 \
                    --fail \
                    --silent \
                    --show-error
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
